<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>PlayCanvas VR Demo</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1a8fe3" />
    <link rel="icon" href="icon-192.png" />
    <style>
        :root {
            --bg: #05070d;
            --accent: #4cc2ff;
            --text: #e8eef8;
            --muted: #8496ad;
        }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
        canvas { display: block; width: 100%; height: 100%; }

        #hud {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text); pointer-events: none;
            background: radial-gradient(ellipse at 50% 45%, rgba(10,20,40,0.55), rgba(5,7,13,0.9) 70%);
        }
        #card {
            pointer-events: auto;
            width: min(90vw, 540px);
            padding: 40px 36px 32px;
            border-radius: 20px;
            background: rgba(14, 20, 34, 0.72);
            border: 1px solid rgba(76, 194, 255, 0.22);
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
            backdrop-filter: blur(14px);
            text-align: center;
        }
        #eyebrow {
            font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
            color: var(--accent); font-weight: 600; margin-bottom: 14px;
        }
        #hud h1 {
            margin: 0 0 14px; font-size: 30px; line-height: 1.15;
            font-weight: 650; letter-spacing: -0.02em; color: #fff;
        }
        #blurb { margin: 0 0 26px; font-size: 15px; line-height: 1.55; color: var(--muted); }
        #blurb b { color: var(--text); font-weight: 600; }

        #enter {
            pointer-events: auto; display: inline-flex; align-items: center; gap: 10px;
            padding: 16px 34px; font-size: 18px; font-weight: 650;
            font-family: inherit; color: #04121c;
            background: linear-gradient(180deg, #7ed6ff, var(--accent));
            border: 0; border-radius: 999px; cursor: pointer;
            box-shadow: 0 8px 26px rgba(76,194,255,0.35);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        #enter:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(76,194,255,0.45); }
        #enter:active { transform: translateY(1px); }
        #enter[disabled] {
            background: #223047; color: #6b7c92; cursor: default;
            box-shadow: none; transform: none;
        }

        #status { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 18px; }
        #status.warn { color: #ffb86b; }
        #note { margin-top: 22px; font-size: 12px; color: #5f7086; line-height: 1.5; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <script src="playcanvas.min.js"></script>
    <div id="hud">
        <div id="card">
            <div id="eyebrow">WebXR &middot; Quest 3</div>
            <h1>Per-pixel depth,<br />straight off the sensors</h1>
            <p id="blurb">
                Real depth from the headset&rsquo;s own sensors &mdash; sampled
                <b>per eye</b>, so it lands on your hands in stereo.
                No AI, no native code.
            </p>
            <button id="enter">Enter Mixed Reality</button>
            <div id="status">checking your headset&hellip;</div>
            <div id="note">Quest 3 or 3S in Meta Quest Browser. You&rsquo;ll be asked to allow spatial data.</div>
        </div>
    </div>
    <script>
    (function () {
        const canvas = document.createElement('canvas');
        document.body.insertBefore(canvas, document.body.firstChild);

        const app = new pc.Application(canvas, {
            mouse: new pc.Mouse(canvas),
            touch: new pc.TouchDevice(canvas),
            keyboard: new pc.Keyboard(window),
            /// alpha must be true or the framebuffer is opaque and AR passthrough
            /// has nothing to composite through — the scene just renders black.
            graphicsDeviceOptions: { antialias: true, alpha: true }
        });
        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        window.addEventListener('resize', () => app.resizeCanvas());

        /// ?scale=<n> drives the WebXR framebuffer scale factor. 1.0 is the UA
        /// default, which is NOT native resolution — the native factor is only
        /// knowable once a session exists, so the panel reports it and we relaunch
        /// with that number to actually claim it.
        /// Bumped by hand on every deploy — the only reliable way to tell in the
        /// headset whether you are looking at a fresh build or a cached one.
        const BUILD = 76;

        const urlParams = new URLSearchParams(location.search);
        const scaleParam = parseFloat(urlParams.get('scale'));
        const requestedScale = (isFinite(scaleParam) && scaleParam > 0) ? scaleParam : 1.5;

        /// ?mode=ar starts an immersive-ar session with depth sensing. Depth and
        /// anchors are MR features, so they need passthrough (immersive-ar) plus
        /// the USE_SCENE android permission that the packaged APK declares.
        /// VR is the default: a plain launch must always come up. AR/depth is
        /// opt-in via ?mode=ar so an experiment can never break the base demo.
        const arMode = urlParams.get('mode') !== 'vr';
        /// ?demo=occlusion turns this into the depth-occlusion experiment:
        /// no fire overlay, splat loaded, real-world depth writing enabled
        const demoOcclusion = urlParams.get('demo') === 'occlusion';
        /// panel, controller rays and cubes are diagnostics - off unless ?debug=1
        const showDebug = urlParams.get('debug') === '1';
        /// PIXELFORMAT_DEPTH (unsigned-short) samples as zero through a normal
        /// sampler2D, so allow the format/usage to be swept from the URL.
        const DFMT = {
            f32: pc.XRDEPTHSENSINGFORMAT_F32,
            la8: pc.XRDEPTHSENSINGFORMAT_L8A8,
            u16: pc.XRDEPTHSENSINGFORMAT_R16U
        };
        const depthFormatPref = DFMT[urlParams.get('dfmt')] || pc.XRDEPTHSENSINGFORMAT_F32;
        /// CPU is the default: getDepth() is disabled under gpu-optimized, and the
        /// GPU texture is unsampleable on Quest Browser anyway.
        const depthUsagePref = urlParams.get('dusage') === 'gpu'
            ? pc.XRDEPTHSENSINGUSAGE_GPU : pc.XRDEPTHSENSINGUSAGE_CPU;
        const dscaleParam = parseFloat(urlParams.get('dscale'));
        let depthScale = isFinite(dscaleParam) ? dscaleParam : (8 / 65535);
        /// Quest hands back NON-LINEAR projective depth: values bunch near the top
        /// of the range. Convert with the z-buffer relation instead of a scale.
        let depthNear = 0.1;
        let depthFar = 8.0;
        let depthProjective = true;
        function rawToMetres(q) {
            if (!depthProjective) return q * depthScale;
            const z = q / 65535;
            const inv = (1 / depthNear) - z * ((1 / depthNear) - (1 / depthFar));
            return inv > 0.0001 ? (1 / inv) : depthFar;
        }
        /// XrManager.start() hard-rejects a type whose async isSessionSupported()
        /// has not resolved yet, so availability must be tracked for the type we
        /// actually intend to start — not just immersive-vr.
        let sessionType = arMode ? pc.XRTYPE_AR : pc.XRTYPE_VR;

        /// ?dusage=cpuonly lists cpu-optimized as the ONLY acceptable usage, so the
        /// UA must either honour it or reject - which tells us definitively whether
        /// Quest supports CPU depth at all. Default keeps PlayCanvas' own list.
        if (navigator.xr && urlParams.get('dusage') === 'cpuonly') {
            const origRequest = navigator.xr.requestSession.bind(navigator.xr);
            navigator.xr.requestSession = function (mode, opts) {
                if (opts && opts.depthSensing) {
                    opts.depthSensing = {
                        usagePreference: ['cpu-optimized'],
                        dataFormatPreference: ['luminance-alpha', 'float32', 'unsigned-short']
                    };
                    console.log('[pcvr] forcing cpu-only depth preference');
                }
                return origRequest(mode, opts).then(function (session) {
                    console.log('[pcvr] session depthUsage=' + session.depthUsage +
                        ' depthDataFormat=' + session.depthDataFormat);
                    return session;
                }, function (err) {
                    console.log('[pcvr] cpu-only depth REJECTED: ' + err.message);
                    throw err;
                });
            };
        }

        app.scene.ambientLight = new pc.Color(0.12, 0.14, 0.2);

        /// camera lives under a rig so we can move the player without fighting
        /// the headset pose the XR system writes onto the camera itself.
        const rig = new pc.Entity('rig');
        app.root.addChild(rig);

        const camera = new pc.Entity('camera');
        camera.addComponent('camera', {
            clearColor: new pc.Color(0.02, 0.03, 0.05),
            farClip: 200
        });
        camera.setLocalPosition(0, 1.6, 0);
        rig.addChild(camera);

        const light = new pc.Entity('key-light');
        light.addComponent('light', {
            type: 'directional', color: new pc.Color(1, 0.96, 0.9),
            intensity: 1.6, castShadows: true, shadowBias: 0.2,
            normalOffsetBias: 0.05, shadowDistance: 40
        });
        light.setEulerAngles(50, 30, 0);
        app.root.addChild(light);

        const fill = new pc.Entity('fill-light');
        fill.addComponent('light', { type: 'omni', color: new pc.Color(0.3, 0.5, 1), intensity: 2, range: 20 });
        fill.setPosition(0, 3, -4);
        app.root.addChild(fill);

        function material(r, g, b, emissive) {
            const m = new pc.StandardMaterial();
            m.diffuse = new pc.Color(r, g, b);
            m.gloss = 0.7;
            m.metalness = 0.1;
            m.useMetalness = true;
            if (emissive) {
                m.emissive = new pc.Color(r, g, b);
                m.emissiveIntensity = 0.6;
            }
            m.update();
            return m;
        }

        const floor = new pc.Entity('floor');
        floor.addComponent('render', { type: 'plane', material: material(0.09, 0.1, 0.13) });
        floor.setLocalScale(40, 1, 40);
        app.root.addChild(floor);

        /// a ring of cubes at eye height — easy to tell at a glance whether
        /// stereo rendering and head tracking are actually live.
        const cubes = [];
        const COUNT = 12;
        for (let i = 0; i < COUNT; i++) {
            const a = (i / COUNT) * Math.PI * 2;
            const hue = (i / COUNT) * Math.PI * 2;
            const cube = new pc.Entity('cube' + i);
            cube.addComponent('render', {
                type: 'box',
                material: material(
                    0.5 + 0.5 * Math.sin(hue),
                    0.5 + 0.5 * Math.sin(hue + 2.09),
                    0.5 + 0.5 * Math.sin(hue + 4.19),
                    true
                )
            });
            cube.setPosition(Math.sin(a) * 3.5, 1.4, Math.cos(a) * 3.5);
            cube.setLocalScale(0.5, 0.5, 0.5);
            cube.enabled = showDebug;
            app.root.addChild(cube);
            cubes.push({ entity: cube, phase: a });
        }

        let t = 0;
        app.on('update', function (dt) {
            t += dt;
            for (let i = 0; i < cubes.length; i++) {
                const c = cubes[i];
                c.entity.rotate(20 * dt, 40 * dt, 0);
                const p = c.entity.getPosition();
                c.entity.setPosition(p.x, 1.4 + Math.sin(t * 1.5 + c.phase) * 0.35, p.z);
            }
        });

        /// ---- controller / hand input: draw a ray from each input source ----
        const rays = new Map();
        function addInputSource(inputSource) {
            if (!showDebug) return;
            const e = new pc.Entity('ray');
            e.addComponent('render', { type: 'box', material: material(0.9, 0.9, 1, true) });
            e.setLocalScale(0.012, 0.012, 1.2);
            app.root.addChild(e);
            rays.set(inputSource, e);
        }
        function removeInputSource(inputSource) {
            const e = rays.get(inputSource);
            if (e) { e.destroy(); rays.delete(inputSource); }
        }
        if (app.xr && app.xr.input) {
            app.xr.input.on('add', addInputSource);
            app.xr.input.on('remove', removeInputSource);
        }
        app.on('update', function () {
            rays.forEach(function (e, inputSource) {
                const o = inputSource.getOrigin();
                const d = inputSource.getDirection();
                e.setPosition(o.x + d.x * 0.6, o.y + d.y * 0.6, o.z + d.z * 0.6);
                e.lookAt(o.x + d.x, o.y + d.y, o.z + d.z);
            });
        });

        /// ---- diagnostics panel ----
        /// Quest Browser gives us no devtools socket, so the readout has to live
        /// in the scene itself: a canvas texture on a quad pinned to the camera.
        const PANEL_W = 1024;
        const PANEL_H = 512;
        const panelCanvas = document.createElement('canvas');
        panelCanvas.width = PANEL_W;
        panelCanvas.height = PANEL_H;
        const pctx = panelCanvas.getContext('2d');

        const panelTex = new pc.Texture(app.graphicsDevice, {
            width: PANEL_W,
            height: PANEL_H,
            format: pc.PIXELFORMAT_RGBA8,
            mipmaps: false,
            addressU: pc.ADDRESS_CLAMP_TO_EDGE,
            addressV: pc.ADDRESS_CLAMP_TO_EDGE
        });
        panelTex.setSource(panelCanvas);

        const panelMat = new pc.StandardMaterial();
        panelMat.diffuse = new pc.Color(0, 0, 0);
        panelMat.emissiveMap = panelTex;
        panelMat.emissive = new pc.Color(1, 1, 1);
        panelMat.useLighting = false;
        panelMat.update();

        const panel = new pc.Entity('diagnostics');
        panel.addComponent('render', { type: 'plane', material: panelMat, castShadows: false });
        panel.setLocalEulerAngles(90, 0, 0);
        panel.setLocalPosition(0, -0.30, -0.9);
        panel.setLocalScale(0.72, 1, 0.36);
        panel.enabled = showDebug;
        camera.addChild(panel);

        function drawPanel(lines) {
            pctx.fillStyle = 'rgba(6, 10, 18, 0.94)';
            pctx.fillRect(0, 0, PANEL_W, PANEL_H);
            pctx.strokeStyle = '#1a8fe3';
            pctx.lineWidth = 6;
            pctx.strokeRect(3, 3, PANEL_W - 6, PANEL_H - 6);
            pctx.textBaseline = 'top';
            for (let i = 0; i < lines.length; i++) {
                /// build stamp gets accent colour so a stale cache is obvious
                if (i === 0) {
                    pctx.fillStyle = '#4cc2ff';
                    pctx.font = '700 44px "Consolas", "Courier New", monospace';
                } else {
                    pctx.fillStyle = '#e8eef8';
                    pctx.font = '600 34px "Consolas", "Courier New", monospace';
                }
                pctx.fillText(lines[i], 34, 24 + i * 44);
            }
            panelTex.upload();
        }

        function num(v, digits) {
            return (typeof v === 'number' && isFinite(v)) ? v.toFixed(digits) : '?';
        }

        function refreshPanel() {
            const lines = [
                'BUILD ' + BUILD + '   mode=' + (sessionType === pc.XRTYPE_AR ? 'ar' : 'vr'),
                '',
                'scale req : ' + num(requestedScale, 3)
            ];
            const s = app.xr.session;

            if (s) {
                let nativeScale = NaN;
                try {
                    nativeScale = window.XRWebGLLayer.getNativeFramebufferScaleFactor(s);
                } catch (e) { /* not exposed on this UA */ }

                const bl = s.renderState && s.renderState.baseLayer;
                let viewCount = '?';
                try { viewCount = app.xr.views.list.length; } catch (e) { /* older api */ }

                lines.push('scale nat : ' + num(nativeScale, 3));
                lines.push('scale pc  : ' + num(app.xr.framebufferScaleFactor, 3));
                lines.push('framebuf  : ' + (bl ? bl.framebufferWidth + ' x ' + bl.framebufferHeight : 'n/a'));
                lines.push('views     : ' + viewCount);
                lines.push('refresh   : ' + (s.frameRate ? num(s.frameRate, 0) + ' Hz' : 'n/a'));
                lines.push('rates     : ' + (s.supportedFrameRates ?
                    Array.from(s.supportedFrameRates).join(' ') : 'n/a'));

                if (arMode) {
                    const v = app.xr.views;
                    lines.push('depth sup : ' + v.supportedDepth + '  avail: ' + v.availableDepth);
                    lines.push('depth fmt : ' + v.depthFormat + ' / ' + v.depthUsage);
                    lines.push('raw ctr   : ' + lastDepthRaw);
                    lines.push('raw range : ' + lastRawLo + ' .. ' + lastRawHi);
                    lines.push('overlay   : d=' + depthDist + ' s=' + depthSize +
                        ' flip=' + (depthFlip ? 1 : 0) + ' mir=' + (depthMirror ? 1 : 0));
                    lines.push('dist      : ' + (lastDepthCentre
                        ? lastDepthCentre.toFixed(3) + ' m' : 'no reading'));
                    bindDepthPreview();
                }
            } else {
                lines.push('(no xr session yet)');
            }

            lines.push('fps       : ' + num(fps, 1));
            drawPanel(lines);
        }

        /// ---- raw WebXR depth, bypassing PlayCanvas ----
        /// Quest Browser hands GPU depth over as a TEXTURE_2D_ARRAY (one layer per
        /// eye, selected by imageIndex) in an unsigned-short *integer* format.
        /// PlayCanvas wraps it as a plain 2D texture, so a sampler2D read returns
        /// zero. Sample it ourselves with usampler2DArray/texelFetch, blit to an
        /// RGBA target, read that back, and publish it through the canvas-texture
        /// path that already works for the readout panel.
        const DEPTH_W = 320;
        const DEPTH_H = 320;

        let depthPreview = null;
        let depthCanvas = null;
        let depthCtx = null;
        let depthImage = null;
        let depthTexture = null;
        let depthPixels = null;

        let glDepth = null;
        let xrBinding = null;
        let lastXrFrame = null;
        let depthFrameLoopStarted = false;
        let depthLoopSession = null;
        let depthGateErr = null;
        let depthRefreshCount = 0;
        let depthLogged = false;
        let depthErrLogged = false;
        let depthFmtLogged = false;
        /// ?dsampler=f forces the normalized-float sampler instead of the integer one
        const useUintSampler = new URLSearchParams(location.search).get('dsampler') !== 'f';
        let lastDepthBlit = 0;
        let lastGridSample = null;
        let lastDepthCentre = 0;
        let lastDepthRaw = 0;
        let lastHist = 0;
        let lastRawLo = 0;
        let lastRawHi = 0;
        const depthOverlay = new URLSearchParams(location.search).get('doverlay') !== '0';
        const dopParam = parseFloat(new URLSearchParams(location.search).get('dop'));
        let depthOpacity = isFinite(dopParam) ? dopParam : 0.75;
        const ddistParam = parseFloat(new URLSearchParams(location.search).get('ddist'));
        let depthDist = isFinite(ddistParam) ? ddistParam : 2.5;
        const dsizeParam = parseFloat(new URLSearchParams(location.search).get('dsize'));
        let depthSize = isFinite(dsizeParam) ? dsizeParam : 0.6;
        let depthFlip = new URLSearchParams(location.search).get('dflip') !== '0';
        let depthMirror = new URLSearchParams(location.search).get('dmirror') === '1';
        const allowGpuBlit = true;

        function startDepthFrameLoop() {
            const session = app.xr.session;
            if (!session) return;
            /// keyed on the session, NOT a one-shot flag - re-entering XR makes
            /// a new session and it needs its own loop
            if (depthLoopSession === session) return;
            depthLoopSession = session;
            depthFrameLoopStarted = true;
            const tick = function (time, frame) {
                lastXrFrame = frame;
                lastFrameTime = time;
                /// refresh the depth handle every frame so the composite samples
                /// the current frame, not whatever the last readback captured
                if (eyeOn || occOn || dbgOn || primeOn) {
                    try { refreshDepthInfo(frame); } catch (e) { depthGateErr = e.message; }
                }
                /// the depth texture is opaque: it is only a legal GL object inside
                /// the frame callback that produced it. Doing the pass later (from
                /// app.on('update')) fails the draw with GL_INVALID_OPERATION.
                if ((cloudOn || readbackOn) && time - lastDepthBlit > 200) {
                    lastDepthBlit = time;
                    try {
                        blitDepth(frame, time);
                    } catch (e) {
                        if (!depthErrLogged) {
                            depthErrLogged = true;
                            console.log('[pcvr] depth blit threw: ' + e.message);
                        }
                    }
                }
                if (app.xr.session === session) {
                    session.requestAnimationFrame(tick);
                } else if (depthLoopSession === session) {
                    /// this session is over; let the next one start its own loop
                    depthLoopSession = null;
                }
            };
            session.requestAnimationFrame(tick);
        }

        function compileShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.log('[pcvr] shader compile failed: ' + gl.getShaderInfoLog(s));
                return null;
            }
            return s;
        }

        function initGlDepth() {
            const gl = app.graphicsDevice.gl;
            if (!gl || glDepth) return glDepth;

            /// Mirrors Meta's proj-multiview-occlusion sample: a FLOAT
            /// sampler2DArray read with texture() and normalised UVs. The integer
            /// sampler + texelFetch combination is what throws INVALID_OPERATION.
            const vs = compileShader(gl, gl.VERTEX_SHADER,
                '#version 300 es\n' +
                'in vec2 aPos;\n' +
                'out vec2 vUv;\n' +
                'void main() {\n' +
                '    vUv = aPos * 0.5 + 0.5;\n' +
                '    gl_Position = vec4(aPos, 0.0, 1.0);\n' +
                '}\n');
            const useFloat = new URLSearchParams(location.search).get('dsampler') !== 'u';
            const fs = compileShader(gl, gl.FRAGMENT_SHADER,
                '#version 300 es\n' +
                'precision highp float;\n' +
                (useFloat
                    ? 'precision highp sampler2DArray;\nuniform sampler2DArray uDepth;\n'
                    : 'precision highp usampler2DArray;\nuniform usampler2DArray uDepth;\n') +
                'uniform float uLayer;\n' +
                'in vec2 vUv;\n' +
                'out vec4 fragColor;\n' +
                'void main() {\n' +
                '    ivec3 c = ivec3(int(gl_FragCoord.x), int(gl_FragCoord.y), int(uLayer));\n' +
                /// pack the RAW value - the previous shader scaled by 1000
                /// and clamped at 16m, which saturated nearly every pixel to 1.0
                /// and made real depth look like a binary mask
                (useFloat
                    ? '    float q = floor(clamp(texture(uDepth, vec3(vUv, uLayer)).r, 0.0, 1.0) * 65535.0 + 0.5);\n'
                    : '    float q = float(texelFetch(uDepth, c, 0).r);\n') +
                '    float hi = floor(q / 256.0);\n' +
                '    float lo = q - hi * 256.0;\n' +
                '    fragColor = vec4(hi / 255.0, lo / 255.0, 0.0, 1.0);\n' +
                '}\n');
            if (!vs || !fs) return null;

            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.bindAttribLocation(prog, 0, 'aPos');
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                console.log('[pcvr] depth program link failed: ' + gl.getProgramInfoLog(prog));
                return null;
            }

            const vbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
            gl.bufferData(gl.ARRAY_BUFFER,
                new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, DEPTH_W, DEPTH_H, 0,
                gl.RGBA, gl.UNSIGNED_BYTE, null);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

            const fbo = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
            const complete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            if (!complete) {
                console.log('[pcvr] own fbo incomplete');
                return null;
            }

            glDepth = {
                prog: prog, vbo: vbo, fbo: fbo, tex: tex,
                uDepth: gl.getUniformLocation(prog, 'uDepth'),
                uLayer: gl.getUniformLocation(prog, 'uLayer'),
                uToMeters: gl.getUniformLocation(prog, 'uToMeters')
            };
            console.log('[pcvr] depth pipeline ready (' +
                (useFloat ? 'float sampler2DArray' : 'usampler2DArray texelFetch') + ')');
            return glDepth;
        }

        function bindDepthPreview() {
            if (!app.xr.views.availableDepth) return;
            startDepthFrameLoop();
        }

        function ensureDepthQuad() {
            if (depthPreview) return;
            depthCanvas = document.createElement('canvas');
            depthCanvas.width = DEPTH_W;
            depthCanvas.height = DEPTH_H;
            depthCtx = depthCanvas.getContext('2d');
            depthImage = depthCtx.createImageData(DEPTH_W, DEPTH_H);

            depthTexture = new pc.Texture(app.graphicsDevice, {
                width: DEPTH_W, height: DEPTH_H, format: pc.PIXELFORMAT_RGBA8,
                mipmaps: false,
                addressU: pc.ADDRESS_CLAMP_TO_EDGE,
                addressV: pc.ADDRESS_CLAMP_TO_EDGE
            });
            depthTexture.setSource(depthCanvas);

            const m = new pc.StandardMaterial();
            m.diffuse = new pc.Color(0, 0, 0);
            m.emissive = new pc.Color(1, 1, 1);
            m.emissiveMap = depthTexture;
            m.useLighting = false;
            m.update();

            depthPreview = new pc.Entity('depth-preview');
            depthPreview.addComponent('render', { type: 'plane', material: m, castShadows: false });
            depthPreview.setLocalEulerAngles(90, 0, 0);

            if (depthOverlay) {
                /// pushed further out and sized below the full frustum so it sits
                /// in the scene rather than pasted on the lens. ?ddist / ?dsize
                /// tune it live without a redeploy.
                const dist = depthDist;
                const fovRad = (camera.camera.fov || 60) * Math.PI / 180;
                const h = 2 * dist * Math.tan(fovRad / 2) * depthSize;
                const w = h * 1.6;
                m.blendType = pc.BLEND_NORMAL;
                m.opacity = depthOpacity;
                m.depthTest = false;
                m.depthWrite = false;
                m.update();
                depthPreview.setLocalPosition(0, 0, -dist);
                depthPreview.setLocalScale(w, 1, h);
            } else {
                depthPreview.setLocalPosition(0.56, -0.28, -1.1);
                depthPreview.setLocalScale(0.34, 1, 0.34);
            }
            camera.addChild(depthPreview);
        }

        /// CPU path: metres straight out of the WebXR depth buffer, no GL involved
        function cpuDepthGrid(view) {
            ensureDepthQuad();
            const data = depthImage.data;
            let valid = 0;
            let minD = Infinity;
            let maxD = -Infinity;
            const STEP = 5;
            for (let y = 0; y < DEPTH_H; y++) {
                for (let x = 0; x < DEPTH_W; x++) {
                    const i = (y * DEPTH_W + x) * 4;
                    let d = null;
                    if ((x % STEP === 0) && (y % STEP === 0)) {
                        d = view.getDepth(x / (DEPTH_W - 1), y / (DEPTH_H - 1));
                        lastGridSample = d;
                    } else {
                        d = lastGridSample;
                    }
                    if (d === null || !isFinite(d) || d <= 0) {
                        data[i] = 0; data[i + 1] = 180; data[i + 2] = 0;
                    } else {
                        valid++;
                        if (d < minD) minD = d;
                        if (d > maxD) maxD = d;
                        const n = Math.min(d / 4, 1);
                        data[i] = Math.round(255 * (1 - n));
                        data[i + 1] = Math.round(255 * n * 0.7);
                        data[i + 2] = Math.round(255 * n);
                    }
                    data[i + 3] = 255;
                }
            }
            depthCtx.putImageData(depthImage, 0, 0);
            depthTexture.upload();

            if (!depthLogged) {
                depthLogged = true;
                console.log('[pcvr] CPU depth grid | valid=' + valid +
                    ' min=' + (isFinite(minD) ? minD.toFixed(3) : 'n/a') +
                    ' max=' + (isFinite(maxD) ? maxD.toFixed(3) : 'n/a') +
                    ' centre=' + view.getDepth(0.5, 0.5));
            }
        }

        let readFbo = null;
        let depthBuf = null;
        let readLogged = false;

        function componentsFor(gl, fmt) {
            if (fmt === gl.RED || fmt === gl.RED_INTEGER) return 1;
            if (fmt === gl.RG || fmt === gl.RG_INTEGER) return 2;
            if (fmt === gl.RGB || fmt === gl.RGB_INTEGER) return 3;
            return 4;
        }

        function allocFor(gl, type, count) {
            if (type === gl.FLOAT) return new Float32Array(count);
            if (type === gl.UNSIGNED_SHORT || type === gl.SHORT ||
                type === gl.UNSIGNED_SHORT_5_6_5) return new Uint16Array(count);
            if (type === gl.UNSIGNED_INT || type === gl.INT) return new Uint32Array(count);
            return new Uint8Array(count);
        }

        function blitDepth(frame, time0) {
            const views = app.xr.views;
            if (!views.availableDepth) return;

            const space = app.xr._referenceSpace;
            if (!space) return;
            const pose = frame.getViewerPose(space);
            if (!pose || !pose.views.length) return;

            if (!views.depthGpuOptimized) {
                if (views.list.length) cpuDepthGrid(views.list[0]);
                return;
            }

            const gl = app.graphicsDevice.gl;
            const g = initGlDepth();
            if (!g) return;
            if (!xrBinding) xrBinding = new XRWebGLBinding(app.xr.session, gl);

            let di = null;
            try {
                di = xrBinding.getDepthInformation(pose.views[0]);
            } catch (e) {
                if (!depthErrLogged) {
                    depthErrLogged = true;
                    console.log('[pcvr] getDepthInformation threw: ' + e.message);
                }
                return;
            }
            if (!di || !di.texture) return;

            lastDi = di;

            const prevFbo = gl.getParameter(gl.FRAMEBUFFER_BINDING);
            const prevProg = gl.getParameter(gl.CURRENT_PROGRAM);
            const prevVp = gl.getParameter(gl.VIEWPORT);
            const prevArr = gl.getParameter(gl.ARRAY_BUFFER_BINDING);
            const prevVao = gl.getParameter(gl.VERTEX_ARRAY_BINDING);
            const prevScissor = gl.isEnabled(gl.SCISSOR_TEST);
            const prevCull = gl.isEnabled(gl.CULL_FACE);
            const prevDepth = gl.isEnabled(gl.DEPTH_TEST);
            const prevBlend = gl.isEnabled(gl.BLEND);
            const prevActive = gl.getParameter(gl.ACTIVE_TEXTURE);

            gl.bindVertexArray(null);
            gl.bindFramebuffer(gl.FRAMEBUFFER, g.fbo);
            gl.viewport(0, 0, DEPTH_W, DEPTH_H);
            gl.useProgram(g.prog);
            gl.disable(gl.DEPTH_TEST);
            gl.disable(gl.BLEND);
            gl.disable(gl.SCISSOR_TEST);
            gl.disable(gl.CULL_FACE);
            gl.colorMask(true, true, true, true);

            const UNIT = 15;
            gl.activeTexture(gl.TEXTURE0 + UNIT);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.bindTexture(gl.TEXTURE_2D_ARRAY, di.texture);
            /// no texParameteri: opaque texture, and the UA already gives it
            /// texStorage-like completeness
            gl.uniform1i(g.uDepth, UNIT);
            gl.uniform1f(g.uLayer, di.imageIndex || 0);
            gl.uniform1f(g.uToMeters, di.rawValueToMeters || 1);

            gl.bindBuffer(gl.ARRAY_BUFFER, g.vbo);
            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

            while (gl.getError() !== gl.NO_ERROR) { /* drain */ }
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            const drawErr = gl.getError();

            if (!depthPixels) depthPixels = new Uint8Array(DEPTH_W * DEPTH_H * 4);
            gl.readPixels(0, 0, DEPTH_W, DEPTH_H, gl.RGBA, gl.UNSIGNED_BYTE, depthPixels);

            gl.bindFramebuffer(gl.FRAMEBUFFER, prevFbo);
            gl.useProgram(prevProg);
            gl.viewport(prevVp[0], prevVp[1], prevVp[2], prevVp[3]);
            gl.bindBuffer(gl.ARRAY_BUFFER, prevArr);
            gl.bindVertexArray(prevVao);
            gl.activeTexture(prevActive);
            if (prevScissor) gl.enable(gl.SCISSOR_TEST);
            if (prevCull) gl.enable(gl.CULL_FACE);
            if (prevDepth) gl.enable(gl.DEPTH_TEST);
            if (prevBlend) gl.enable(gl.BLEND);

            /// decode the packed 16-bit metres and paint the quad
            ensureDepthQuad();
            const src = depthPixels;
            const px = depthImage.data;
            let valid = 0, minD = Infinity, maxD = -Infinity;
            const rowBytes = DEPTH_W * 4;

            /// first pass: find the range of non-zero samples this frame
            let qLo = 65535, qHi = 0;
            for (let i2 = 0; i2 < src.length; i2 += 4) {
                const q2 = src[i2] * 256 + src[i2 + 1];
                if (q2 === 0) continue;
                if (q2 < qLo) qLo = q2;
                if (q2 > qHi) qHi = q2;
            }
            const qSpan = Math.max(1, qHi - qLo);
            lastRawLo = qLo;
            lastRawHi = qHi;

            for (let y = 0; y < DEPTH_H; y++) {
                /// readPixels is bottom-up and ImageData is top-down, but the XR
                /// depth texture may already be oriented - ?dflip=0 to compare
                const sy = depthFlip ? (DEPTH_H - 1 - y) : y;
                const s0 = sy * rowBytes;
                for (let x = 0; x < DEPTH_W; x++) {
                    const sx = depthMirror ? (DEPTH_W - 1 - x) : x;
                    const si = s0 + sx * 4;
                    const q = src[si] * 256 + src[si + 1];
                    const d = rawToMetres(q);
                    const i = (y * DEPTH_W + x) * 4;
                    if (q === 0) {
                        px[i] = 0; px[i + 1] = 180; px[i + 2] = 0;
                        px[i + 3] = depthOverlay ? 0 : 255;
                        continue;
                    } else {
                        valid++;
                        if (d < minD) minD = d;
                        if (d > maxD) maxD = d;
                        const n = (q - qLo) / qSpan;
                        px[i] = Math.round(255 * (1 - n));
                        px[i + 1] = Math.round(255 * n * 0.7);
                        px[i + 2] = Math.round(255 * n);
                    }
                    px[i + 3] = 255;
                }
            }
            depthCtx.putImageData(depthImage, 0, 0);
            depthTexture.upload();

            if (cloudOn) {
                try {
                    updateCloud(views.list[di.imageIndex || 0], src);
                } catch (e) {
                    if (!depthErrLogged) {
                        depthErrLogged = true;
                        console.log('[pcvr] cloud update failed: ' + e.message);
                    }
                }
            }

            const ci = ((DEPTH_H >> 1) * DEPTH_W + (DEPTH_W >> 1)) * 4;
            lastDepthRaw = src[ci] * 256 + src[ci + 1];
            lastDepthCentre = rawToMetres(lastDepthRaw);

            /// histogram every ~2s: min/max hid whether this is graded or binary
            if (time0 - lastHist > 2000) {
                lastHist = time0;
                const b = [0, 0, 0, 0, 0, 0];
                for (let y = 0; y < DEPTH_H; y += 2) {
                    for (let x = 0; x < DEPTH_W; x += 2) {
                        const si = ((DEPTH_H - 1 - y) * DEPTH_W + x) * 4;
                        const q = src[si] * 256 + src[si + 1];
                        if (q === 0) b[0]++;
                        else if (q === 65535) b[5]++;
                        else if (q < 1000) b[1]++;
                        else if (q < 5000) b[2]++;
                        else if (q < 20000) b[3]++;
                        else b[4]++;
                    }
                }
                console.log('[pcvr] hist zero=' + b[0] + ' <1k=' + b[1] +
                    ' 1k-5k=' + b[2] + ' 5k-20k=' + b[3] + ' 20k-65k=' + b[4] +
                    ' sat=' + b[5] + ' | rawCentre=' + lastDepthRaw);
            }

            if (!readLogged) {
                readLogged = true;
                console.log('[pcvr] DEPTH SAMPLE | drawErr=' + drawErr +
                    ' toMeters=' + di.rawValueToMeters +
                    ' valid=' + valid + '/' + (DEPTH_W * DEPTH_H) +
                    ' min=' + (isFinite(minD) ? minD.toFixed(3) : 'n/a') +
                    ' max=' + (isFinite(maxD) ? maxD.toFixed(3) : 'n/a') +
                    ' centre=' + lastDepthCentre.toFixed(3) + 'm' +
                    ' rawCentre=' + (src[ci] * 256 + src[ci + 1]) +
                    ' scale=' + depthScale);
            }
        }

        let fps = 0;
        let frameCount = 0;
        let frameAccum = 0;
        app.on('update', function (dt) {
            frameCount++;
            frameAccum += dt;
            if (frameAccum >= 0.5) {
                fps = frameCount / frameAccum;
                frameCount = 0;
                frameAccum = 0;
                refreshPanel();
            }
        });

        /// ---- session plumbing ----
        const hud = document.getElementById('hud');
        const btn = document.getElementById('enter');
        const status = document.getElementById('status');

        function setStatus(msg, warn) {
            status.textContent = msg;
            status.classList.toggle('warn', !!warn);
        }

        let sessionRequested = false;

        function startXR(reason) {
            if (sessionRequested || app.xr.active) return;
            sessionRequested = true;
            console.log('[pcvr] requesting session (' + reason + ') scale=' + requestedScale +
                ' mode=' + (arMode ? 'ar' : 'vr'));

            const opts = {
                framebufferScaleFactor: requestedScale,
                callback: function (err) {
                    if (err) {
                        /// let a later trigger (the button, or availability
                        /// arriving late) try again rather than latching off.
                        sessionRequested = false;
                        console.log('[pcvr] session failed: ' + err.message);
                        /// a plain page load has no user activation - that is
                        /// expected, not an error worth alarming anyone with
                        if (/activation/i.test(err.message)) {
                            setStatus('ready \u2014 tap the button to start', false);
                        } else {
                            setStatus(err.message, true);
                        }
                    } else {
                        console.log('[pcvr] session started');
                    }
                }
            };

            if (sessionType === pc.XRTYPE_AR) {
                /// the floor is passthrough now, so drop our own ground plane
                floor.enabled = false;
                opts.depthSensing = {
                    usagePreference: depthUsagePref,
                    dataFormatPreference: depthFormatPref
                };
            }

            app.xr.start(camera.camera, sessionType, pc.XRSPACE_LOCALFLOOR, opts);
        }

        app.xr.on('end', function () {
            /// these belong to the session that just ended
            depthLoopSession = null;
            lastDi = null;
            lastDiViews[0] = null;
            lastDiViews[1] = null;
            xrBinding = null;
            console.log('[pcvr] xr ended, depth handles dropped');
        });

        app.xr.on('start', function () {
            if (demoOcclusion) {
                loadSplat();
                setTimeout(function () {
                    ensureProbes();
                    window.pcvr.occlude(false);
                    window.pcvr.prime(true);
                }, 800);
            }
            hud.classList.add('hidden');
            /// transparent clear in AR so the real room shows behind the scene
            if (app.xr.type === pc.XRTYPE_AR) {
                camera.camera.clearColor = new pc.Color(0, 0, 0, 0);
                console.log('[pcvr] ar clear colour set transparent');
            }
        });
        app.xr.on('end', function () {
            hud.classList.remove('hidden');
            setStatus('session ended — tap to go back in');
        });

        btn.addEventListener('click', function () {
            /// re-pick the session type at click time. The fallback timer below
            /// fires while we are simply waiting for the user's tap, and used to
            /// leave sessionType pinned to VR - which is why AR never started.
            if (arMode && app.xr.isAvailable(pc.XRTYPE_AR)) {
                sessionType = pc.XRTYPE_AR;
                floor.enabled = false;
            }
            sessionRequested = false;
            startXR('button');
        });

        if (demoOcclusion) {
            document.querySelector('#hud h1').innerHTML = 'Real-world occlusion,<br />depth-tested';
            document.getElementById('blurb').innerHTML =
                'The headset&rsquo;s depth is written into the z-buffer, so virtual content &mdash; '
                + 'including a <b>gaussian splat</b> &mdash; is hidden by your real hands.';
        }
        console.log('[pcvr] boot | build=' + BUILD + ' | xr.supported=' + app.xr.supported +
            ' | available=' + app.xr.isAvailable(sessionType));
        document.getElementById('eyebrow').textContent = 'WebXR · Quest 3 · build ' + BUILD;

        if (!app.xr.supported) {
            btn.disabled = true;
            setStatus('this browser has no WebXR support', true);
        } else {
            /// Availability resolves asynchronously (navigator.xr.isSessionSupported),
            /// so on a headset it is still false at load time. Auto-start has to hang
            /// off this event as well, not just the synchronous read below.
            /// Availability for each session type resolves independently and can
            /// arrive in any order, so re-evaluate the choice on every event
            /// instead of committing to one type up front. AR preferred, VR is
            /// the floor, and a timeout guarantees we never sit in the OS splash.
            let arResolved = false;
            const startedAt = Date.now();

            const tryStart = function (reason) {
                if (sessionRequested || app.xr.active) return;

                if (arMode && app.xr.isAvailable(pc.XRTYPE_AR)) {
                    sessionType = pc.XRTYPE_AR;
                    startXR(reason + ':ar');
                    return;
                }

                /// immersive-vr availability lands a beat before immersive-ar, so
                /// don't settle for VR until AR has actually reported in — otherwise
                /// we always lose the race and never get passthrough.
                if (arMode && !arResolved && Date.now() - startedAt < 1500) return;

                if (app.xr.isAvailable(pc.XRTYPE_VR)) {
                    sessionType = pc.XRTYPE_VR;
                    floor.enabled = true;
                    startXR(reason + ':vr');
                }
            };

            [pc.XRTYPE_AR, pc.XRTYPE_VR].forEach(function (t) {
                app.xr.on('available:' + t, function (available) {
                    console.log('[pcvr] available:' + t + ' -> ' + available);
                    if (t === pc.XRTYPE_AR) arResolved = true;
                    btn.disabled = !(app.xr.isAvailable(pc.XRTYPE_VR) ||
                        app.xr.isAvailable(pc.XRTYPE_AR));
                    tryStart('event');
                });
            });

            setStatus('checking your headset…');

            /// Meta grants the activation to an immersive-mode PWA: "clicking the PWA
            /// app icon is considered user action to create a WebXR session". So the
            /// launch itself is the gesture — request as soon as a device is known.
            tryStart('load');

            /// An immersive-ar request can sit pending forever (permission prompt,
            /// or activation the UA won't honour) — and because sessionRequested is
            /// already true, nothing would ever retry. If no session is actually
            /// live by now, drop the pending request and take VR instead.
            setTimeout(function () {
                if (app.xr.active) return;
                if (arMode && app.xr.isAvailable(pc.XRTYPE_AR)) {
                    /// AR is there, we are just waiting for a user gesture
                    console.log('[pcvr] awaiting user activation, not downgrading');
                    return;
                }
                console.log('[pcvr] no session, falling back to vr (was ' + sessionType + ')');
                sessionRequested = false;
                sessionType = pc.XRTYPE_VR;
                floor.enabled = true;
                startXR('timeout');
            }, 10000);
        }

        /// flat fallback: slow orbit so a desktop / 2D launch is not a dead screen
        app.on('update', function (dt) {
            if (app.xr.active) return;
            rig.rotate(0, 4 * dt, 0);
        });

        let lastFrameTime = 0;
        let readbackOn = false;

        /// cheap per-frame handle refresh - no GPU stall
        function refreshDepthInfo(frame) {
            const views = app.xr.views;
            if (!views.availableDepth) { depthGateErr = 'availableDepth false'; return; }
            const space = app.xr._referenceSpace;
            if (!space) { depthGateErr = 'no reference space'; return; }
            const pose = frame.getViewerPose(space);
            if (!pose || !pose.views.length) { depthGateErr = 'no viewer pose'; return; }
            depthGateErr = null;
            depthRefreshCount++;
            const gl = app.graphicsDevice.gl;
            if (!xrBinding) xrBinding = new XRWebGLBinding(app.xr.session, gl);
            for (let i = 0; i < pose.views.length && i < 2; i++) {
                let d = null;
                try { d = xrBinding.getDepthInformation(pose.views[i]); } catch (e) { d = null; }
                if (d && d.texture) {
                    lastDiViews[i] = d;
                    if (i === 0) lastDi = d;
                }
            }
        }

        /// ---- per-eye screen-space depth composite ----
        let eyeProg = null;
        let eyeOn = !demoOcclusion;
        let eyeAlpha = 0.6;
        /// FIXED range - auto-contrast per frame makes a near object rescale the
        /// whole scene, which reads as the background shifting when a hand appears
        let eyeLo = 45000;
        let eyeHi = 65535;
        let lastDi = null;
        const lastDiViews = [null, null];
        let sweepSpeed = 0.25;
        let sweepFixed = 0.5;
        let sweepBands = 4.0;
        let sweepSharp = 260.0;
        let sweepDistLo = 0.15;
        let sweepDistHi = 3.0;
        let sweepEase = 2.0;
        let fireDist = 0.4;
        let fineBands = 45.0;   // rings per metre in the near field (~2cm)
        let edgeAmt = 0.25;
        let shadeAmt = 260.0;

        function initEyeProg() {
            const gl = app.graphicsDevice.gl;
            if (eyeProg) return eyeProg;

            const vs = compileShader(gl, gl.VERTEX_SHADER,
                '#version 300 es\n' +
                'out vec2 vUv;\n' +
                'void main() {\n' +
                '    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);\n' +
                '    vUv = p;\n' +
                '    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n' +
                '}\n');
            const fs = compileShader(gl, gl.FRAGMENT_SHADER,
                '#version 300 es\n' +
                'precision highp float;\n' +
                'precision highp sampler2DArray;\n' +
                'uniform sampler2DArray uDepth;\n' +
                'uniform float uLayer;\n' +
                'uniform float uLo;\n' +
                'uniform float uHi;\n' +
                'uniform float uAlpha;\n' +
                'uniform float uSlice;\n' +
                'uniform float uBands;\n' +
                'uniform float uSharp;\n' +
                'uniform float uNear;\n' +
                'uniform float uFar;\n' +
                'uniform float uSliceM;\n' +
                'uniform float uTime;\n' +
                'uniform float uFireDist;\n' +
                'uniform float uFineBands;\n' +
                'uniform float uEdge;\n' +
                'uniform float uShade;\n' +
                'uniform float uTexel;\n' +
                'in vec2 vUv;\n' +
                'out vec4 fragColor;\n' +
                'void main() {\n' +
                '    float raw = texture(uDepth, vec3(vUv, uLayer)).r * 65535.0;\n' +
                '    if (raw <= 0.0) { discard; }\n' +
                /// UNCLAMPED for contours and the sweep, so both keep working
                /// past either end of the window. Clamping made every pixel
                /// nearer than uLo collapse to n=0, which fract() turned into
                /// one permanent band - a constant faint wash up close.
                '    float nUn = (raw - uLo) / max(1.0, uHi - uLo);\n' +
                '    float n = clamp(nUn, 0.0, 1.0);\n' +
                /// topographic iso-depth contours
                /// convert the projective value to metres, then do the sweep and
                /// the contours in METRIC space. In raw space the near field eats
                /// most of the range, so a linear sweep crawls up close and races
                /// away in the distance - and the band is thin near, fat far.
                '    float zz = raw / 65535.0;\n' +
                '    float invd = (1.0 / uNear) - zz * ((1.0 / uNear) - (1.0 / uFar));\n' +
                '    float dm = 1.0 / max(invd, 0.0001);\n' +
                '    float ring = abs(fract(dm * uBands) - 0.5) * 2.0;\n' +
                /// a hand is only a few cm deep, so the coarse rings barely
                /// register on it - lay a much finer set over the near field
                '    float fine = abs(fract(dm * uFineBands) - 0.5) * 2.0;\n' +
                '    float nearMask = 1.0 - smoothstep(uFireDist * 0.9, uFireDist * 1.8, dm);\n' +
                /// depth gradient: big local change means a silhouette edge,
                /// which is what picks out fingers against what is behind them
                '    float rL = texture(uDepth, vec3(vUv - vec2(uTexel, 0.0), uLayer)).r;\n' +
                '    float rR = texture(uDepth, vec3(vUv + vec2(uTexel, 0.0), uLayer)).r;\n' +
                '    float rU = texture(uDepth, vec3(vUv - vec2(0.0, uTexel), uLayer)).r;\n' +
                '    float rD = texture(uDepth, vec3(vUv + vec2(0.0, uTexel), uLayer)).r;\n' +
                '    float grad = abs(rR - rL) + abs(rD - rU);\n' +
                '    float edge = smoothstep(0.0015, 0.010, grad) * uEdge;\n' +
                /// crude surface normal straight from the depth slopes, lit from
                /// upper-left. Gives the burning region real shading instead of a
                /// flat glow - knuckles and finger curvature start to read.
                '    vec3 nrm = normalize(vec3(-(rR - rL) * uShade, -(rD - rU) * uShade, 1.0));\n' +
                '    float lam = clamp(dot(nrm, normalize(vec3(-0.45, -0.55, 0.70))), 0.0, 1.0);\n' +
                '    float shade = 0.45 + 0.85 * lam;\n' +
                '    float rim = pow(1.0 - abs(nrm.z), 2.0);\n' +
                '    float contour = smoothstep(0.88, 1.0, ring);\n' +
                /// a plane sweeping through the depth range
                '    float dist = dm - uSliceM;\n' +
                '    float glow = exp(-dist * dist * uSharp);\n' +
                '    vec3 base = vec3(1.0 - n, n * 0.55, n);\n' +
                '    float fineC = smoothstep(0.86, 1.0, fine) * nearMask;\n' +
                '    vec3 col = base * 0.55 + vec3(0.25, 0.55, 0.75) * contour;\n' +
                '    col += vec3(0.55, 0.75, 0.95) * fineC * 0.55;\n' +
                '    col += vec3(1.0, 0.95, 0.85) * edge;\n' +
                /// cyan halo plus a much tighter white-hot core, so the peak
                /// reads as white lightning rather than saturated cyan
                '    float core = exp(-dist * dist * uSharp * 8.0);\n' +
                /// close up it burns like fire, further out it stays cold
                /// lightning - blended over a short band around uFireDist
                '    float fire = 1.0 - smoothstep(uFireDist * 0.8, uFireDist * 1.25, dm);\n' +
                '    float flick = 0.86 + 0.14 * sin(uTime * 19.0 + dm * 26.0 + vUv.y * 37.0);\n' +
                '    vec3 haloCol = mix(vec3(0.35, 0.85, 1.0), vec3(1.00, 0.38, 0.06) * flick, fire);\n' +
                '    vec3 coreCol = mix(vec3(1.0, 1.0, 1.0), vec3(1.00, 0.88, 0.55), fire);\n' +
                '    col += haloCol * glow * shade + haloCol * glow * rim * 0.6;\n' +
                '    col += coreCol * core * 1.4 * (0.55 + 0.75 * lam);\n' +
                '    float a = uAlpha * (0.30 + 0.70 * glow + 0.9 * core + 0.35 * contour + 0.30 * fineC + 0.55 * edge);\n' +
                '    fragColor = vec4(col, clamp(a, 0.0, 1.0));\n' +
                '}\n');
            if (!vs || !fs) return null;

            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                console.log('[pcvr] eye program link failed: ' + gl.getProgramInfoLog(prog));
                return null;
            }
            eyeProg = {
                prog: prog,
                uDepth: gl.getUniformLocation(prog, 'uDepth'),
                uLayer: gl.getUniformLocation(prog, 'uLayer'),
                uLo: gl.getUniformLocation(prog, 'uLo'),
                uHi: gl.getUniformLocation(prog, 'uHi'),
                uAlpha: gl.getUniformLocation(prog, 'uAlpha'),
                uSlice: gl.getUniformLocation(prog, 'uSlice'),
                uBands: gl.getUniformLocation(prog, 'uBands'),
                uSharp: gl.getUniformLocation(prog, 'uSharp'),
                uNear: gl.getUniformLocation(prog, 'uNear'),
                uFar: gl.getUniformLocation(prog, 'uFar'),
                uSliceM: gl.getUniformLocation(prog, 'uSliceM'),
                uTime: gl.getUniformLocation(prog, 'uTime'),
                uFireDist: gl.getUniformLocation(prog, 'uFireDist'),
                uFineBands: gl.getUniformLocation(prog, 'uFineBands'),
                uEdge: gl.getUniformLocation(prog, 'uEdge'),
                uTexel: gl.getUniformLocation(prog, 'uTexel')
            };
            console.log('[pcvr] per-eye composite program ready');
            return eyeProg;
        }

        /// speed profile -> cumulative table -> inverted for phase lookup.
        /// slow off the mark, slow again around focusDist (hand range), quicker
        /// through the empty space in between and beyond.
        let focusDist = 0.55;
        let dwellAmt = 0.82;
        let dwellWidth = 0.13;
        /// share of the cycle spent on the slow near-field burn
        let burnFrac = 0.75;
        let sweepTable = null;

        function buildSweepTable() {
            const N = 256;
            const speed = new Float64Array(N);
            const cum = new Float64Array(N + 1);
            const span = Math.max(0.0001, sweepDistHi - sweepDistLo);
            const pf = (focusDist - sweepDistLo) / span;
            let acc = 0;

            for (let i = 0; i < N; i++) {
                const t = (i + 0.5) / N;
                const g = Math.exp(-((t - pf) * (t - pf)) / (2 * dwellWidth * dwellWidth));
                /// (soft start) x (dwell at the focus distance)
                const v = (0.30 + 0.70 * t) * (1 - dwellAmt * g);
                speed[i] = Math.max(0.02, v);
            }
            for (let i = 0; i < N; i++) {
                acc += speed[i];
                cum[i + 1] = acc;
            }
            for (let i = 0; i <= N; i++) cum[i] /= acc;
            sweepTable = { cum: cum, N: N };
        }

        function phaseToFrac(phase) {
            if (!sweepTable) buildSweepTable();
            const cum = sweepTable.cum;
            const N = sweepTable.N;
            let lo = 0;
            let hi = N;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (cum[mid] < phase) lo = mid + 1; else hi = mid;
            }
            const i = Math.max(1, lo);
            const denom = Math.max(1e-9, cum[i] - cum[i - 1]);
            const t = (phase - cum[i - 1]) / denom;
            return (i - 1 + t) / N;
        }

        /// draw after PlayCanvas has rendered, straight into the XR framebuffer
        function compositeEyes() {
            if (!eyeOn || !app.xr.active || !lastDi || !lastDi.texture) return;
            const gl = app.graphicsDevice.gl;
            const g = initEyeProg();
            if (!g) return;

            const views = app.xr.views.list;
            if (!views.length) return;

            const prevProg = gl.getParameter(gl.CURRENT_PROGRAM);
            const prevVao = gl.getParameter(gl.VERTEX_ARRAY_BINDING);
            const prevVp = gl.getParameter(gl.VIEWPORT);
            const prevBlend = gl.isEnabled(gl.BLEND);
            const prevDepth = gl.isEnabled(gl.DEPTH_TEST);
            const prevScissor = gl.isEnabled(gl.SCISSOR_TEST);
            const prevActive = gl.getParameter(gl.ACTIVE_TEXTURE);

            /// PlayCanvas has its own FBO bound at postrender, not the XR layer,
            /// so target the XR framebuffer explicitly or the draw goes nowhere
            let xrFb = null;
            try { xrFb = app.xr.session.renderState.baseLayer.framebuffer; } catch (e) {}
            const prevFb = gl.getParameter(gl.FRAMEBUFFER_BINDING);
            if (xrFb !== undefined) gl.bindFramebuffer(gl.FRAMEBUFFER, xrFb);

            gl.bindVertexArray(null);
            gl.useProgram(g.prog);
            gl.disable(gl.DEPTH_TEST);
            gl.disable(gl.SCISSOR_TEST);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            const UNIT = 14;
            gl.activeTexture(gl.TEXTURE0 + UNIT);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.bindTexture(gl.TEXTURE_2D_ARRAY, lastDi.texture);
            gl.uniform1i(g.uDepth, UNIT);
            gl.uniform1f(g.uLo, eyeLo);
            gl.uniform1f(g.uHi, eyeHi);
            gl.uniform1f(g.uAlpha, eyeAlpha);
            /// sweep the slice through the depth range over time
            /// travel in RAW depth units so the plane genuinely starts at 0 and
            /// covers everything, rather than starting at whatever raw value the
            /// contrast window's lower edge happens to sit on
            const phase = sweepSpeed > 0
                ? ((lastFrameTime * 0.001 * sweepSpeed) % 1.0)
                : sweepFixed;
            /// linear in metres, so the bolt travels at a constant real-world
            /// speed and keeps a constant real-world thickness
            /// Two explicit stages rather than one blended curve:
            ///   burnFrac of the cycle creeps from the near plane out to fireDist
            ///   the remainder accelerates away to the far end as lightning
            let sliceM;
            if (phase < burnFrac) {
                const t = phase / Math.max(0.0001, burnFrac);
                sliceM = sweepDistLo + (fireDist - sweepDistLo) * (t * t * (3 - 2 * t));
            } else {
                const t = (phase - burnFrac) / Math.max(0.0001, 1 - burnFrac);
                sliceM = fireDist + (sweepDistHi - fireDist) * (t * t);
            }
            gl.uniform1f(g.uSlice, 0.0);
            gl.uniform1f(g.uBands, sweepBands);
            gl.uniform1f(g.uSharp, sweepSharp);
            gl.uniform1f(g.uNear, depthNear);
            gl.uniform1f(g.uFar, depthFar);
            gl.uniform1f(g.uSliceM, sliceM);
            gl.uniform1f(g.uTime, lastFrameTime * 0.001);
            gl.uniform1f(g.uFireDist, fireDist);
            gl.uniform1f(g.uFineBands, fineBands);
            gl.uniform1f(g.uEdge, edgeAmt);
            gl.uniform1f(g.uShade, shadeAmt);
            gl.uniform1f(g.uTexel, 1.0 / DEPTH_W);

            for (let i = 0; i < views.length; i++) {
                const vp = views[i].viewport;
                gl.viewport(vp.x, vp.y, vp.z, vp.w);
                /// each eye samples ITS OWN layer of the depth array
                gl.uniform1f(g.uLayer, i);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }

            gl.bindFramebuffer(gl.FRAMEBUFFER, prevFb);
            gl.useProgram(prevProg);
            gl.bindVertexArray(prevVao);
            gl.viewport(prevVp[0], prevVp[1], prevVp[2], prevVp[3]);
            gl.activeTexture(prevActive);
            if (!prevBlend) gl.disable(gl.BLEND);
            if (prevDepth) gl.enable(gl.DEPTH_TEST);
            if (prevScissor) gl.enable(gl.SCISSOR_TEST);
        }

        app.on('postrender', compositeEyes);

        /// ---- occlusion DEBUG VIEW ---------------------------------------
        /// Nothing here writes depth. It draws, per eye, what the occlusion
        /// test would have concluded, so a wrong answer is visible instead of
        /// just being a hole in the picture:
        ///
        ///   background   sensor distance as a blue->red ramp over dbgLo..dbgHi
        ///                (transparent where the sensor returned nothing)
        ///   white ring   where a probe sphere actually is on screen
        ///   red fill     sensor says "something is IN FRONT of this sphere"
        ///                -> this is the region that would have been cut away
        ///   green fill   sensor says "sphere is in front", nothing to cut
        ///
        /// If the red blob is not sitting on your hand, the two are misaligned.
        let dbgProg = null;
        let dbgOn = false;
        let dbgMode = 1;          // 0 ramp only, 1 ramp + probe test, 2 test only
        let dbgLo = 0.15;         // metres at the blue end
        let dbgHi = 2.0;          // metres at the red end
        let dbgAlpha = 0.5;
        let dbgMetric = 0;        // 0 = projective near/far guess, 1 = API depthValueToMeters
        let dbgUseUv = 1;         // apply the API depthUvMatrix
        let dbgPerView = 1;       // per-view depth info + imageIndex, not layer==eye
        let sceneDepthWarned = false;

        function initDbgProg() {
            const gl = app.graphicsDevice.gl;
            if (dbgProg) return dbgProg;

            const vs = compileShader(gl, gl.VERTEX_SHADER,
                '#version 300 es\n' +
                'out vec2 vUv;\n' +
                'void main() {\n' +
                '    vec2 q = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n' +
                '    vUv = q;\n' +
                '    gl_Position = vec4(q * 2.0 - 1.0, 0.0, 1.0);\n' +
                '}\n');

            const fs = compileShader(gl, gl.FRAGMENT_SHADER,
                '#version 300 es\n' +
                'precision highp float;\n' +
                'precision highp sampler2DArray;\n' +
                'uniform sampler2DArray uDepth;\n' +
                'uniform float uLayer;\n' +
                'uniform float uNear;\n' +
                'uniform float uFar;\n' +
                'uniform float uD2M;\n' +
                'uniform float uMetric;\n' +
                'uniform mat3 uUvM;\n' +
                'uniform float uUseUv;\n' +
                'uniform float uLo;\n' +
                'uniform float uHi;\n' +
                'uniform float uAlpha;\n' +
                'uniform float uMode;\n' +
                'uniform float uAspect;\n' +
                'uniform float uNumProbes;\n' +
                'uniform vec4 uProbe[4];\n' +
                'uniform sampler2D uScene;\n' +
                'uniform vec4 uVp;\n' +
                'uniform vec2 uRt;\n' +
                'uniform float uP10;\n' +
                'uniform float uP14;\n' +
                'uniform float uBias;\n' +
                'in vec2 vUv;\n' +
                'out vec4 fragColor;\n' +
                'vec3 ramp(float t) {\n' +
                '    t = clamp(t, 0.0, 1.0);\n' +
                '    return clamp(vec3(1.6 - abs(4.0 * t - 3.0),\n' +
                '                      1.6 - abs(4.0 * t - 2.0),\n' +
                '                      1.6 - abs(4.0 * t - 1.0)), 0.0, 1.0);\n' +
                '}\n' +
                'void main() {\n' +
                '    vec2 duv = uUseUv > 0.5 ? (uUvM * vec3(vUv, 1.0)).xy : vUv;\n' +
                '    float raw = texture(uDepth, vec3(duv, uLayer)).r;\n' +
                '    vec3 col = vec3(0.0);\n' +
                '    float a = 0.0;\n' +
                '    float dm = -1.0;\n' +
                '    if (raw > 0.0) {\n' +
                '        if (uMetric < 0.5) {\n' +
                '            float invd = (1.0 / uNear) - raw * ((1.0 / uNear) - (1.0 / uFar));\n' +
                '            dm = 1.0 / max(invd, 0.0001);\n' +
                '        } else {\n' +
                '            dm = raw * 65535.0 * uD2M;\n' +
                '        }\n' +
                '        if (uMode < 1.5) {\n' +
                '            col = ramp((dm - uLo) / max(0.0001, uHi - uLo));\n' +
                '            a = uAlpha;\n' +
                '        }\n' +
                '    }\n' +
                '    if (uMode > 0.5 && uMode < 2.5) {\n' +
                '        vec2 ndc = vUv * 2.0 - 1.0;\n' +
                '        for (int i = 0; i < 4; i++) {\n' +
                '            if (float(i) >= uNumProbes) break;\n' +
                '            vec4 pr = uProbe[i];\n' +
                '            if (pr.z <= 0.0) continue;\n' +
                '            vec2 dd = ndc - pr.xy;\n' +
                '            dd.x *= uAspect;\n' +
                '            float r = length(dd);\n' +
                '            if (r < pr.z) {\n' +
                '                if (dm < 0.0) {\n' +
                '                    col = mix(col, vec3(0.5), 0.5); a = max(a, 0.35);\n' +
                '                } else if (dm < pr.w) {\n' +
                '                    col = mix(col, vec3(1.0, 0.0, 0.0), 0.8); a = max(a, 0.6);\n' +
                '                } else {\n' +
                '                    col = mix(col, vec3(0.0, 0.5, 0.0), 0.45); a = max(a, 0.4);\n' +
                '                }\n' +
                '            } else if (r < pr.z * 1.05) {\n' +
                '                col = vec3(1.0); a = 0.95;\n' +
                '            }\n' +
                '        }\n' +
                '    }\n' +
                '    if (uMode > 2.5) {\n' +
                /// vUv is 0..1 inside THIS eye's viewport; the scene depth map
                /// covers the whole render target, so remap before sampling
                '        vec2 rtUv = (uVp.xy + vUv * uVp.zw) / uRt;\n' +
                '        float sd = texture(uScene, rtUv).r;\n' +
                '        float zndc = sd * 2.0 - 1.0;\n' +
                '        float sceneM = uP14 / (zndc + uP10);\n' +
                '        bool hasScene = sd < 0.999999;\n' +
                '        if (uMode < 3.5) {\n' +
                /// 3: what PlayCanvas thinks the scene depth is, same ramp
                '            if (!hasScene) discard;\n' +
                '            fragColor = vec4(ramp((sceneM - uLo) / max(0.0001, uHi - uLo)), uAlpha);\n' +
                '            return;\n' +
                '        } else if (uMode < 4.5) {\n' +
                /// 4: the verdict, everywhere, drawn instead of applied
                '            if (!hasScene) discard;\n' +
                '            if (dm > 0.0 && dm < sceneM - uBias) {\n' +
                '                fragColor = vec4(1.0, 0.0, 0.0, 0.6);\n' +
                '            } else {\n' +
                '                fragColor = vec4(0.0, 0.6, 0.0, 0.22);\n' +
                '            }\n' +
                '            return;\n' +
                '        }\n' +
                /// 5: apply it - clear the pixel so passthrough shows through
                '        if (!hasScene) discard;\n' +
                '        if (dm > 0.0 && dm < sceneM - uBias) { fragColor = vec4(0.0); return; }\n' +
                '        discard;\n' +
                '    }\n' +
                '    if (a <= 0.0) discard;\n' +
                '    fragColor = vec4(col, a);\n' +
                '}\n');
            if (!vs || !fs) return null;

            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                console.log('[pcvr] debug program link failed: ' + gl.getProgramInfoLog(prog));
                return null;
            }
            dbgProg = {
                prog: prog,
                uDepth: gl.getUniformLocation(prog, 'uDepth'),
                uLayer: gl.getUniformLocation(prog, 'uLayer'),
                uNear: gl.getUniformLocation(prog, 'uNear'),
                uFar: gl.getUniformLocation(prog, 'uFar'),
                uD2M: gl.getUniformLocation(prog, 'uD2M'),
                uMetric: gl.getUniformLocation(prog, 'uMetric'),
                uUvM: gl.getUniformLocation(prog, 'uUvM'),
                uUseUv: gl.getUniformLocation(prog, 'uUseUv'),
                uLo: gl.getUniformLocation(prog, 'uLo'),
                uHi: gl.getUniformLocation(prog, 'uHi'),
                uAlpha: gl.getUniformLocation(prog, 'uAlpha'),
                uMode: gl.getUniformLocation(prog, 'uMode'),
                uAspect: gl.getUniformLocation(prog, 'uAspect'),
                uNumProbes: gl.getUniformLocation(prog, 'uNumProbes'),
                uProbe: gl.getUniformLocation(prog, 'uProbe[0]'),
                uScene: gl.getUniformLocation(prog, 'uScene'),
                uVp: gl.getUniformLocation(prog, 'uVp'),
                uRt: gl.getUniformLocation(prog, 'uRt'),
                uP10: gl.getUniformLocation(prog, 'uP10'),
                uP14: gl.getUniformLocation(prog, 'uP14'),
                uBias: gl.getUniformLocation(prog, 'uBias')
            };
            console.log('[pcvr] debug view program ready');
            return dbgProg;
        }

        /// PlayCanvas' scene depth map, as a raw GL handle we can bind ourselves
        let sceneDepthRequested = false;
        let lastSceneTex = null;
        function sceneDepthGl() {
            const st = app.graphicsDevice.scope.resolve('uSceneDepthMap');
            const tex = st && st.value;
            lastSceneTex = tex || null;
            if (!tex || !tex.impl) return null;
            return tex.impl._glTexture || null;
        }
        function requestSceneDepth(on) {
            const cc = camera.camera;
            if (!cc || typeof cc.requestSceneDepthMap !== 'function') return false;
            if (on && sceneDepthRequested) return true;
            if (!on && !sceneDepthRequested) return true;
            cc.requestSceneDepthMap(on);
            sceneDepthRequested = on;
            return true;
        }

        /// where each probe lands on screen for THIS eye, plus how far away it is
        const probeBuf = new Float32Array(16);
        const dbgUv = new Float32Array(9);
        function fillProbes(view) {
            probeBuf.fill(0);
            if (!probes || !probes.length) return 0;
            const pm = view.projMat && view.projMat.data;
            const pvm = view._projViewOffMat && view._projViewOffMat.data;
            if (!pm || !pvm) return 0;
            const n = Math.min(4, probes.length);
            for (let i = 0; i < n; i++) {
                const wp = probes[i].getPosition();
                const x = wp.x, y = wp.y, z = wp.z;
                /// straight to clip space with the engine's own view-projection
                const cx = pvm[0] * x + pvm[4] * y + pvm[8] * z + pvm[12];
                const cy = pvm[1] * x + pvm[5] * y + pvm[9] * z + pvm[13];
                const cw = pvm[3] * x + pvm[7] * y + pvm[11] * z + pvm[15];
                /// w is -z_eye, i.e. the distance along the view axis
                if (cw <= 0.02) { probeBuf[i * 4 + 2] = 0; continue; }
                const radius = probes[i].getLocalScale().x * 0.5;
                probeBuf[i * 4 + 0] = cx / cw;
                probeBuf[i * 4 + 1] = cy / cw;
                probeBuf[i * 4 + 2] = radius * pm[5] / cw;
                probeBuf[i * 4 + 3] = cw;
            }
            return n;
        }

        function drawDebug() {
            if (!dbgOn || !app.xr.active) return;
            const views = app.xr.views.list;
            if (!views.length) return;
            const di0 = lastDiViews[0] || lastDi;
            if (!di0 || !di0.texture) return;
            const gl = app.graphicsDevice.gl;
            const g = initDbgProg();
            if (!g) return;

            const prevProg = gl.getParameter(gl.CURRENT_PROGRAM);
            const prevVao = gl.getParameter(gl.VERTEX_ARRAY_BINDING);
            const prevVp = gl.getParameter(gl.VIEWPORT);
            const prevBlend = gl.isEnabled(gl.BLEND);
            const prevDepth = gl.isEnabled(gl.DEPTH_TEST);
            const prevScissor = gl.isEnabled(gl.SCISSOR_TEST);
            const prevActive = gl.getParameter(gl.ACTIVE_TEXTURE);

            let xrFb = null;
            try { xrFb = app.xr.session.renderState.baseLayer.framebuffer; } catch (e) {}
            const prevFb = gl.getParameter(gl.FRAMEBUFFER_BINDING);
            if (xrFb !== undefined) gl.bindFramebuffer(gl.FRAMEBUFFER, xrFb);

            gl.bindVertexArray(null);
            gl.useProgram(g.prog);
            gl.disable(gl.DEPTH_TEST);
            gl.disable(gl.SCISSOR_TEST);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            const UNIT = 12;
            gl.activeTexture(gl.TEXTURE0 + UNIT);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.uniform1i(g.uDepth, UNIT);
            gl.uniform1f(g.uNear, depthNear);
            gl.uniform1f(g.uFar, depthFar);
            gl.uniform1f(g.uMetric, dbgMetric);
            gl.uniform1f(g.uUseUv, dbgUseUv);
            gl.uniform1f(g.uLo, dbgLo);
            gl.uniform1f(g.uHi, dbgHi);
            gl.uniform1f(g.uAlpha, dbgAlpha);
            gl.uniform1f(g.uMode, dbgMode);
            gl.uniform1f(g.uBias, occBias);

            /// modes 3+ need the scene depth; bail out visibly rather than
            /// drawing something meaningless if it is not there yet
            const SUNIT = 11;
            if (dbgMode > 2.5) {
                const sgl = sceneDepthGl();
                if (!sgl) {
                    if (!sceneDepthWarned) {
                        sceneDepthWarned = true;
                        console.log('[pcvr] scene depth map not available yet');
                    }
                    gl.useProgram(prevProg);
                    gl.bindVertexArray(prevVao);
                    if (prevFb !== undefined) gl.bindFramebuffer(gl.FRAMEBUFFER, prevFb);
                    if (!prevBlend) gl.disable(gl.BLEND);
                    if (prevDepth) gl.enable(gl.DEPTH_TEST);
                    if (prevScissor) gl.enable(gl.SCISSOR_TEST);
                    return;
                }
                gl.activeTexture(gl.TEXTURE0 + SUNIT);
                gl.bindTexture(gl.TEXTURE_2D, sgl);
                gl.uniform1i(g.uScene, SUNIT);
                gl.uniform2f(g.uRt, lastSceneTex.width, lastSceneTex.height);
                gl.activeTexture(gl.TEXTURE0 + UNIT);
                /// mode 5 overwrites the pixel outright, it must not blend
                if (dbgMode > 4.5) gl.disable(gl.BLEND);
            }

            for (let i = 0; i < views.length; i++) {
                const view = views[i];
                const di = (dbgPerView > 0.5 && lastDiViews[i]) ? lastDiViews[i] : di0;
                const vp = view.viewport;
                gl.viewport(vp.x, vp.y, vp.z, vp.w);
                gl.bindTexture(gl.TEXTURE_2D_ARRAY, di.texture);
                /// imageIndex is the authoritative array slice for this eye
                const layer = (di.imageIndex !== undefined && di.imageIndex !== null)
                    ? di.imageIndex : i;
                gl.uniform1f(g.uLayer, layer);
                gl.uniform1f(g.uD2M, di.rawValueToMeters || view.depthValueToMeters || 1.0);
                /// depthUvMatrix maps normalised view UV -> normalised depth UV.
                /// PlayCanvas hands it over as a Mat4; take the 2D affine part.
                const m = view.depthUvMatrix && view.depthUvMatrix.data;
                if (m) {
                    dbgUv[0] = m[0]; dbgUv[1] = m[1]; dbgUv[2] = 0;
