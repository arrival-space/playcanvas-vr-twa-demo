                    dbgUv[3] = m[4]; dbgUv[4] = m[5]; dbgUv[5] = 0;
                    dbgUv[6] = m[12]; dbgUv[7] = m[13]; dbgUv[8] = 1;
                } else {
                    dbgUv[0] = 1; dbgUv[1] = 0; dbgUv[2] = 0;
                    dbgUv[3] = 0; dbgUv[4] = 1; dbgUv[5] = 0;
                    dbgUv[6] = 0; dbgUv[7] = 0; dbgUv[8] = 1;
                }
                gl.uniformMatrix3fv(g.uUvM, false, dbgUv);
                gl.uniform1f(g.uAspect, vp.z / Math.max(1, vp.w));
                gl.uniform4f(g.uVp, vp.x, vp.y, vp.z, vp.w);
                const pmd = view.projMat && view.projMat.data;
                gl.uniform1f(g.uP10, pmd ? pmd[10] : -1.001);
                gl.uniform1f(g.uP14, pmd ? pmd[14] : -0.2001);
                const n = fillProbes(view);
                gl.uniform1f(g.uNumProbes, n);
                gl.uniform4fv(g.uProbe, probeBuf);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }

            if (prevFb !== undefined) gl.bindFramebuffer(gl.FRAMEBUFFER, prevFb);
            gl.useProgram(prevProg);
            gl.bindVertexArray(prevVao);
            gl.viewport(prevVp[0], prevVp[1], prevVp[2], prevVp[3]);
            gl.activeTexture(prevActive);
            if (!prevBlend) gl.disable(gl.BLEND);
            if (prevDepth) gl.enable(gl.DEPTH_TEST);
            if (prevScissor) gl.enable(gl.SCISSOR_TEST);
        }

        /// ---- depth prime: the real occluder -----------------------------
        let primeProg = null;
        let primeOn = false;
        let primeBias = 0.02;      // metres; push the real world slightly back
        let primeSmooth = 6;       // 0 nearest 1 bilinear 2 tent 3 edge-snap 4 fxaa 6 MLAA
        let primeSubpix = 0.75;    // fxaa sub-pixel aliasing strength
        let primeSoften = 0.75;    // texels; feather applied AFTER edge reconstruction
        let primeEdge = 0.01;      // raw units; below this there is no edge to snap to
        let primeSigma = 0.7;      // gauss width, texels
        let primeHardK = 20.0;     // hardening slope; high keeps the edge
                                   // independent of the background
        let primeLayer = null;
        let primeAnchor = null;
        let primeErr = null;
        let primeDraws = 0;

        function ensurePrimeLayer() {
            if (primeLayer) return primeLayer;
            primeLayer = new pc.Layer({ name: 'DepthPrime' });
            /// index 0 = first render action, so it takes the camera's clear
            app.scene.layers.insert(primeLayer, 0);
            const cc = camera.camera;
            if (cc.layers.indexOf(primeLayer.id) === -1) {
                cc.layers = [primeLayer.id].concat(cc.layers);
            }
            /// a mesh instance so the layer definitely produces a render action.
            /// It writes nothing - no colour, no depth.
            const m = new pc.StandardMaterial();
            m.depthWrite = false;
            m.depthTest = false;
            m.redWrite = false;
            m.greenWrite = false;
            m.blueWrite = false;
            m.alphaWrite = false;
            m.update();
            primeAnchor = new pc.Entity('depth-prime-anchor');
            primeAnchor.addComponent('render', {
                type: 'plane',
                material: m,
                layers: [primeLayer.id]
            });
            primeAnchor.setLocalScale(0.01, 0.01, 0.01);
            camera.addChild(primeAnchor);
            primeAnchor.setLocalPosition(0, 0, -0.5);
            console.log('[pcvr] depth prime layer inserted at 0');
            return primeLayer;
        }

        function initPrimeProg() {
            const gl = app.graphicsDevice.gl;
            if (primeProg) return primeProg;
            const vs = compileShader(gl, gl.VERTEX_SHADER,
                '#version 300 es\n' +
                'out vec2 vUv;\n' +
                'void main() {\n' +
                '    vec2 q = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n' +
                '    vUv = q;\n' +
                '    gl_Position = vec4(q * 2.0 - 1.0, 0.0, 1.0);\n' +
                '}\n');
            const fs = compileShader(gl, gl.FRAGMENT_SHADER,
                '#version 300 es\n' +
                'precision highp float;\n' +
                'precision highp sampler2DArray;\n' +
                'uniform sampler2DArray uDepth;\n' +
                'uniform float uLayer;\n' +
                'uniform float uNear;\n' +
                'uniform float uFar;\n' +
                'uniform float uP10;\n' +
                'uniform float uP14;\n' +
                'uniform float uBias;\n' +
                'uniform float uSmooth;\n' +
                'uniform float uEdgeT;\n' +
                'uniform float uSigma;\n' +
                'uniform float uHardK;\n' +
                'uniform float uSubpix;\n' +
                'uniform float uSoften;\n' +
                'uniform vec2 uTexSize;\n' +
                'in vec2 vUv;\n' +
                'out vec4 fragColor;\n' +
                /// one tap, carrying its own validity as the weight
                'vec2 tap(vec2 uv, float w) {\n' +
                '    float r = texture(uDepth, vec3(uv, uLayer)).r;\n' +
                '    return r > 0.0 ? vec2(r * w, w) : vec2(0.0);\n' +
                '}\n' +
                /// blended value plus the local near/far extremes, zeros excluded
                'vec3 gather(vec2 uv) {\n' +
                '    vec2 ts = uTexSize;\n' +
                '    vec2 p = uv * ts - 0.5;\n' +
                '    vec2 f = fract(p);\n' +
                '    vec2 b = floor(p) + 0.5;\n' +
                '    vec2 acc = vec2(0.0);\n' +
                '    float mn = 1.0;\n' +
                '    float mx = 0.0;\n' +
                '    for (int j = 0; j <= 1; j++) {\n' +
                '        for (int i = 0; i <= 1; i++) {\n' +
                '            vec2 o = vec2(float(i), float(j));\n' +
                '            float w = (i == 0 ? 1.0 - f.x : f.x) * (j == 0 ? 1.0 - f.y : f.y);\n' +
                '            float r = texture(uDepth, vec3((b + o) / ts, uLayer)).r;\n' +
                '            if (r > 0.0) { acc += vec2(r * w, w); mn = min(mn, r); mx = max(mx, r); }\n' +
                '        }\n' +
                '    }\n' +
                '    if (acc.y <= 0.0001) return vec3(0.0);\n' +
                '    return vec3(acc.x / acc.y, mn, mx);\n' +
                '}\n' +
                'float lumaAt(vec2 uv, float c) {\n' +
                '    float r = texture(uDepth, vec3(uv, uLayer)).r;\n' +
                '    return r > 0.0 ? r : c;\n' +
                '}\n' +
                'float tentAt(vec2 uv, float radius, float c) {\n' +
                '    if (radius <= 0.001) {\n' +
                '        float r0 = texture(uDepth, vec3(uv, uLayer)).r;\n' +
                '        return r0 > 0.0 ? r0 : c;\n' +
                '    }\n' +
                '    vec2 rcp = 1.0 / uTexSize;\n' +
                '    float acc = 0.0;\n' +
                '    float wsum = 0.0;\n' +
                '    for (int j = -1; j <= 1; j++) {\n' +
                '        for (int i = -1; i <= 1; i++) {\n' +
                '            float w = (1.0 - abs(float(i)) * 0.5) * (1.0 - abs(float(j)) * 0.5);\n' +
                '            vec2 o = vec2(float(i), float(j)) * radius * rcp;\n' +
                '            float r0 = texture(uDepth, vec3(uv + o, uLayer)).r;\n' +
                '            if (r0 > 0.0) { acc += r0 * w; wsum += w; }\n' +
                '        }\n' +
                '    }\n' +
                '    return wsum > 0.0001 ? acc / wsum : c;\n' +
                '}\n' +
                'float fxaaDepth(vec2 uv) {\n' +
                '    vec2 ts = uTexSize;\n' +
                '    vec2 rcp = 1.0 / ts;\n' +
                '    float m = texture(uDepth, vec3(uv, uLayer)).r;\n' +
                '    if (m <= 0.0) return 0.0;\n' +
                '    float n = lumaAt(uv + vec2(0.0, -rcp.y), m);\n' +
                '    float s2 = lumaAt(uv + vec2(0.0, rcp.y), m);\n' +
                '    float e = lumaAt(uv + vec2(rcp.x, 0.0), m);\n' +
                '    float w = lumaAt(uv + vec2(-rcp.x, 0.0), m);\n' +
                '    float mx = max(m, max(max(n, s2), max(e, w)));\n' +
                '    float mn = min(m, min(min(n, s2), min(e, w)));\n' +
                '    float range = mx - mn;\n' +
                '    if (range < uEdgeT) return m;\n' +
                '    float nw = lumaAt(uv + vec2(-rcp.x, -rcp.y), m);\n' +
                '    float ne = lumaAt(uv + vec2(rcp.x, -rcp.y), m);\n' +
                '    float sw = lumaAt(uv + vec2(-rcp.x, rcp.y), m);\n' +
                '    float se = lumaAt(uv + vec2(rcp.x, rcp.y), m);\n' +
                '    float ns = n + s2;\n' +
                '    float we = w + e;\n' +
                '    float nwsw = nw + sw;\n' +
                '    float nese = ne + se;\n' +
                '    float nwne = nw + ne;\n' +
                '    float swse = sw + se;\n' +
                '    float edgeH = abs(-2.0 * w + nwsw) + abs(-2.0 * m + ns) * 2.0 + abs(-2.0 * e + nese);\n' +
                '    float edgeV = abs(-2.0 * n + nwne) + abs(-2.0 * m + we) * 2.0 + abs(-2.0 * s2 + swse);\n' +
                '    bool horz = edgeH >= edgeV;\n' +
                '    float l1 = horz ? n : w;\n' +
                '    float l2 = horz ? s2 : e;\n' +
                '    float g1 = l1 - m;\n' +
                '    float g2 = l2 - m;\n' +
                '    bool steep1 = abs(g1) >= abs(g2);\n' +
                '    float gradScaled = 0.25 * max(abs(g1), abs(g2));\n' +
                '    float stepLen = horz ? rcp.y : rcp.x;\n' +
                '    float localAvg = 0.0;\n' +
                '    if (steep1) { stepLen = -stepLen; localAvg = 0.5 * (l1 + m); }\n' +
                '    else { localAvg = 0.5 * (l2 + m); }\n' +
                '    vec2 cuv = uv;\n' +
                '    if (horz) cuv.y += stepLen * 0.5; else cuv.x += stepLen * 0.5;\n' +
                '    vec2 off = horz ? vec2(rcp.x, 0.0) : vec2(0.0, rcp.y);\n' +
                '    vec2 uv1 = cuv - off;\n' +
                '    vec2 uv2 = cuv + off;\n' +
                '    float end1 = lumaAt(uv1, m) - localAvg;\n' +
                '    float end2 = lumaAt(uv2, m) - localAvg;\n' +
                '    bool done1 = abs(end1) >= gradScaled;\n' +
                '    bool done2 = abs(end2) >= gradScaled;\n' +
                '    if (!done1) uv1 -= off;\n' +
                '    if (!done2) uv2 += off;\n' +
                '    if (!(done1 && done2)) {\n' +
                '        for (int i = 2; i < 12; i++) {\n' +
                '            float q = (i < 5) ? 1.0 : ((i < 7) ? 1.5 : ((i < 9) ? 2.0 : 4.0));\n' +
                '            if (!done1) { end1 = lumaAt(uv1, m) - localAvg; done1 = abs(end1) >= gradScaled; }\n' +
                '            if (!done2) { end2 = lumaAt(uv2, m) - localAvg; done2 = abs(end2) >= gradScaled; }\n' +
                '            if (done1 && done2) break;\n' +
                '            if (!done1) uv1 -= off * q;\n' +
                '            if (!done2) uv2 += off * q;\n' +
                '        }\n' +
                '    }\n' +
                '    float d1 = horz ? (uv.x - uv1.x) : (uv.y - uv1.y);\n' +
                '    float d2 = horz ? (uv2.x - uv.x) : (uv2.y - uv.y);\n' +
                '    bool near1 = d1 < d2;\n' +
                '    float dFinal = min(d1, d2);\n' +
                '    float thick = d1 + d2;\n' +
                '    float pixOff = -dFinal / max(thick, 1e-6) + 0.5;\n' +
                '    bool centreSmaller = m < localAvg;\n' +
                '    bool ok = ((near1 ? end1 : end2) < 0.0) != centreSmaller;\n' +
                '    float finalOff = ok ? pixOff : 0.0;\n' +
                '    float avg = (1.0 / 12.0) * (2.0 * (ns + we) + nwsw + nese);\n' +
                '    float sp1 = clamp(abs(avg - m) / max(range, 1e-6), 0.0, 1.0);\n' +
                '    float sp2 = (-2.0 * sp1 + 3.0) * sp1 * sp1;\n' +
                '    finalOff = max(finalOff, sp2 * sp2 * uSubpix);\n' +
                '    vec2 fuv = uv;\n' +
                '    if (horz) fuv.y += finalOff * stepLen; else fuv.x += finalOff * stepLen;\n' +
                '    return tentAt(fuv, uSoften, m);\n' +
                '}\n' +
                'float texI(float i, float j) {\n' +
                '    return texture(uDepth, vec3((vec2(i, j) + 0.5) / uTexSize, uLayer)).r;\n' +
                '}\n' +
                'float biRaw(vec2 uv) {\n' +
                '    vec3 g = gather(uv);\n' +
                '    return g.y <= 0.0 ? 0.0 : g.x;\n' +
                '}\n' +
                'int clsAt(float i, float j, float level) {\n' +
                '    return texI(i, j) > level ? 1 : 0;\n' +
                '}\n' +
                'float edgeAt(bool horz, float c, float guess, float level) {\n' +
                '    for (int d = 0; d <= 2; d++) {\n' +
                '        float g = guess - float(d);\n' +
                '        int a1 = horz ? clsAt(c, g, level) : clsAt(g, c, level);\n' +
                '        int b1 = horz ? clsAt(c, g + 1.0, level) : clsAt(g + 1.0, c, level);\n' +
                '        if (a1 != b1) return g + 1.0;\n' +
                '        if (d > 0) {\n' +
                '            float g2 = guess + float(d);\n' +
                '            int a2 = horz ? clsAt(c, g2, level) : clsAt(g2, c, level);\n' +
                '            int b2 = horz ? clsAt(c, g2 + 1.0, level) : clsAt(g2 + 1.0, c, level);\n' +
                '            if (a2 != b2) return g2 + 1.0;\n' +
                '        }\n' +
                '    }\n' +
                '    return -9999.0;\n' +
                '}\n' +
                'vec4 mlaaAxis(bool horz, vec2 t, float level) {\n' +
                '    float a = horz ? t.x : t.y;\n' +
                '    float ia = floor(a);\n' +
                '    float ib = floor(horz ? t.y : t.x);\n' +
                '    float e0 = edgeAt(horz, ia, ib, level);\n' +
                '    if (e0 < -9000.0) return vec4(0.0, 0.0, 0.0, -1.0);\n' +
                '    float L = 0.0;\n' +
                '    for (int k = 0; k < 16; k++) {\n' +
                '        if (edgeAt(horz, ia - L - 1.0, ib, level) != e0) break;\n' +
                '        L += 1.0;\n' +
                '    }\n' +
                '    float R = 0.0;\n' +
                '    for (int k = 0; k < 16; k++) {\n' +
                '        if (edgeAt(horz, ia + R + 1.0, ib, level) != e0) break;\n' +
                '        R += 1.0;\n' +
                '    }\n' +
                '    float N = L + R + 1.0;\n' +
                '    float aStart = ia - L;\n' +
                '    float eL = edgeAt(horz, aStart - 1.0, ib, level);\n' +
                '    float eR = edgeAt(horz, aStart + N, ib, level);\n' +
                '    float pos = 0.0;\n' +
                '    if (eL == e0 - 1.0 && eR == e0 + 1.0) {\n' +
                '        pos = e0 - 0.5 + (a - aStart) / N;\n' +
                '    } else if (eL == e0 + 1.0 && eR == e0 - 1.0) {\n' +
                '        pos = e0 + 0.5 - (a - aStart) / N;\n' +
                /// anything that is not a clean ramp is "no stair found".
                /// Guessing here is what produced the speckle.
                '    } else {\n' +
                '        return vec4(0.0, 0.0, 0.0, -1.0);\n' +
                '    }\n' +
                '    float nearS = horz ? texI(ia, e0 - 1.0) : texI(e0 - 1.0, ia);\n' +
                '    float farS = horz ? texI(ia, e0) : texI(e0, ia);\n' +
                '    return vec4(pos, nearS, farS, N);\n' +
                '}\n' +
                'float gaussHard(vec2 uv, float mn, float mx) {\n' +
                '    float acc = 0.0;\n' +
                '    float w = 0.0;\n' +
                '    for (int j = -2; j <= 2; j++) {\n' +
                '        for (int i = -2; i <= 2; i++) {\n' +
                '            float r = biRaw(uv + vec2(float(i), float(j)) / uTexSize);\n' +
                '            if (r <= 0.0) continue;\n' +
                '            float g = exp(-(float(i * i + j * j)) / (2.0 * uSigma * uSigma));\n' +
                '            acc += r * g; w += g;\n' +
                '        }\n' +
                '    }\n' +
                '    if (w <= 0.0) return 0.0;\n' +
                '    float blur = acc / w;\n' +
                '    float rng = mx - mn;\n' +
                /// fade in the hardening rather than switching to it: a hard
                /// switch between two formulas is itself a discontinuity
                '    float f0 = uEdgeT * 0.5;\n' +
                '    float f1 = uEdgeT * 1.5;\n' +
                '    float wh = clamp((rng - f0) / max(1e-6, f1 - f0), 0.0, 1.0);\n' +
                '    wh = wh * wh * (3.0 - 2.0 * wh);\n' +
                '    if (wh <= 0.0) return blur;\n' +
                /// t is a COVERAGE fraction, normalised by the local contrast,
                /// so the hardened edge does not move when the background does
                '    float t = (blur - mn) / max(rng, 1e-6);\n' +
                '    float th = clamp((t - 0.5) * uHardK + 0.5, 0.0, 1.0);\n' +
                '    return blur + ((mn + rng * th) - blur) * wh;\n' +
                '}\n' +
                'float mlaaRaw(vec2 uv) {\n' +
                '    vec2 t = uv * uTexSize;\n' +
                '    float ix = floor(t.x);\n' +
                '    float iy = floor(t.y);\n' +
                '    float mn = 1.0;\n' +
                '    float mx = 0.0;\n' +
                '    for (int j = -1; j <= 1; j++) {\n' +
                '        for (int i = -1; i <= 1; i++) {\n' +
                '            float r = texI(ix + float(i), iy + float(j));\n' +
                '            if (r > 0.0) { mn = min(mn, r); mx = max(mx, r); }\n' +
                '        }\n' +
                '    }\n' +
                '    if (mx - mn < uEdgeT) return biRaw(uv);\n' +
                '    float level = 0.5 * (mn + mx);\n' +
                /// both axes: the longer run is the shallower edge. Choosing an
                /// axis up front gets steep edges wrong.
                '    vec4 hh = mlaaAxis(true, t, level);\n' +
                '    vec4 vv = mlaaAxis(false, t, level);\n' +
                '    vec4 r = (hh.w >= vv.w) ? hh : vv;\n' +
                '    float b = (hh.w >= vv.w) ? t.y : t.x;\n' +
                /// a clean stair was found -> a hard pick between two MEASURED
                /// depths. No blending, so the silhouette cannot change shape
                /// when the background moves.
                '    if (r.w >= 2.0) return b < r.x ? r.y : r.z;\n' +
                /// no clean stair: MLAA has nothing to say here, and this is
                /// exactly where gauss+harden is at its best
                '    return gaussHard(uv, mn, mx);\n' +
                '}\n' +
                'float sampleRaw(vec2 uv) {\n' +
                '    if (uSmooth < 0.5) return texture(uDepth, vec3(uv, uLayer)).r;\n' +
                '    if (uSmooth > 5.5) return mlaaRaw(uv);\n' +
                '    if (uSmooth > 3.5) return fxaaDepth(uv);\n' +
                '    if (uSmooth > 1.5 && uSmooth < 2.5) {\n' +
                /// wider tent, for comparison
                '        vec2 ts = uTexSize;\n' +
                '        vec2 p = uv * ts - 0.5;\n' +
                '        vec2 f = fract(p);\n' +
                '        vec2 b = floor(p) + 0.5;\n' +
                '        vec2 acc = vec2(0.0);\n' +
                '        for (int j = -1; j <= 1; j++) {\n' +
                '            for (int i = -1; i <= 1; i++) {\n' +
                '                vec2 o = vec2(float(i), float(j));\n' +
                '                vec2 d = abs(o - f);\n' +
                '                float w = max(0.0, 1.0 - d.x * 0.5) * max(0.0, 1.0 - d.y * 0.5);\n' +
                '                acc += tap((b + o) / ts, w);\n' +
                '            }\n' +
                '        }\n' +
                '        return acc.y > 0.0001 ? acc.x / acc.y : 0.0;\n' +
                '    }\n' +
                '    vec3 g = gather(uv);\n' +
                '    if (g.y <= 0.0) return 0.0;\n' +
                /// FXAA-flavoured: only act where there IS an edge, and then do
                /// not average across it - pick the side the ramp is nearer to
                '    if (uSmooth > 2.5 && (g.z - g.y) > uEdgeT) {\n' +
                '        return (g.x - g.y) < (g.z - g.x) ? g.y : g.z;\n' +
                '    }\n' +
                '    return g.x;\n' +
                '}\n' +
                'void main() {\n' +
                '    fragColor = vec4(0.0);\n' +
                '    float raw = sampleRaw(vUv);\n' +
                /// no reading -> leave it at the far plane, occlude nothing
                '    if (raw <= 0.0) { gl_FragDepth = 1.0; return; }\n' +
                '    float invd = (1.0 / uNear) - raw * ((1.0 / uNear) - (1.0 / uFar));\n' +
                '    float dm = 1.0 / max(invd, 0.0001) + uBias;\n' +
                /// sensor metres -> NDC z for THIS eye's projection -> [0,1]
                '    float zndc = -uP10 + uP14 / max(dm, 0.01);\n' +
                '    gl_FragDepth = clamp((zndc + 1.0) * 0.5, 0.0, 1.0);\n' +
                '}\n');
            if (!vs || !fs) return null;
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                primeErr = gl.getProgramInfoLog(prog);
                console.log('[pcvr] prime program link failed: ' + primeErr);
                return null;
            }
            primeProg = {
                prog: prog,
                uDepth: gl.getUniformLocation(prog, 'uDepth'),
                uLayer: gl.getUniformLocation(prog, 'uLayer'),
                uNear: gl.getUniformLocation(prog, 'uNear'),
                uFar: gl.getUniformLocation(prog, 'uFar'),
                uP10: gl.getUniformLocation(prog, 'uP10'),
                uP14: gl.getUniformLocation(prog, 'uP14'),
                uBias: gl.getUniformLocation(prog, 'uBias'),
                uSmooth: gl.getUniformLocation(prog, 'uSmooth'),
                uEdgeT: gl.getUniformLocation(prog, 'uEdgeT'),
                uSigma: gl.getUniformLocation(prog, 'uSigma'),
                uHardK: gl.getUniformLocation(prog, 'uHardK'),
                uSubpix: gl.getUniformLocation(prog, 'uSubpix'),
                uSoften: gl.getUniformLocation(prog, 'uSoften'),
                uTexSize: gl.getUniformLocation(prog, 'uTexSize')
            };
            console.log('[pcvr] depth prime program ready');
            return primeProg;
        }

        function runPrime() {
            if (!primeOn || !app.xr.active) return;
            const views = app.xr.views.list;
            if (!views.length) return;
            const di0 = lastDiViews[0] || lastDi;
            if (!di0 || !di0.texture) return;
            const gl = app.graphicsDevice.gl;
            const g = initPrimeProg();
            if (!g) return;

            /// whatever framebuffer PlayCanvas is rendering this layer into is
            /// exactly the one we want - do NOT rebind anything here
            gl.bindVertexArray(null);
            gl.useProgram(g.prog);
            gl.enable(gl.DEPTH_TEST);
            gl.depthFunc(gl.ALWAYS);
            gl.depthMask(true);
            gl.disable(gl.BLEND);
            gl.disable(gl.CULL_FACE);
            gl.disable(gl.SCISSOR_TEST);
            gl.colorMask(false, false, false, false);

            const UNIT = 10;
            gl.activeTexture(gl.TEXTURE0 + UNIT);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.uniform1i(g.uDepth, UNIT);
            gl.uniform1f(g.uNear, depthNear);
            gl.uniform1f(g.uFar, depthFar);
            gl.uniform1f(g.uBias, primeBias);
            gl.uniform1f(g.uSmooth, primeSmooth);
            gl.uniform1f(g.uEdgeT, primeEdge);
            gl.uniform1f(g.uSigma, primeSigma);
            gl.uniform1f(g.uHardK, primeHardK);
            gl.uniform1f(g.uSubpix, primeSubpix);
            gl.uniform1f(g.uSoften, primeSoften);
            gl.uniform2f(g.uTexSize, di0.width || DEPTH_W, di0.height || DEPTH_H);

            for (let i = 0; i < views.length; i++) {
                const view = views[i];
                const di = lastDiViews[i] || di0;
                if (!di || !di.texture) continue;
                const vp = view.viewport;
                const pm = view.projMat && view.projMat.data;
                gl.viewport(vp.x, vp.y, vp.z, vp.w);
                gl.bindTexture(gl.TEXTURE_2D_ARRAY, di.texture);
                const slice = (di.imageIndex !== undefined && di.imageIndex !== null)
                    ? di.imageIndex : i;
                gl.uniform1f(g.uLayer, slice);
                gl.uniform1f(g.uP10, pm ? pm[10] : -1.001);
                gl.uniform1f(g.uP14, pm ? pm[14] : -0.2001);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }

            gl.colorMask(true, true, true, true);
            gl.depthFunc(gl.LESS);
            primeDraws++;

            /// We changed GL behind the device's back, so its cached state is
            /// now a lie. Flip each cached value to something else and back so
            /// the next draw re-applies it for real.
            const gd = app.graphicsDevice;
            try {
                gd.setDepthState(pc.DepthState.WRITEDEPTH);
                gd.setDepthState(pc.DepthState.DEFAULT);
                gd.setBlendState(pc.BlendState.ALPHABLEND);
                gd.setBlendState(pc.BlendState.NOBLEND);
                gd.setCullMode(pc.CULLFACE_NONE);
                gd.setCullMode(pc.CULLFACE_BACK);
            } catch (e) {
                primeErr = 'state restore: ' + e.message;
            }
        }

        app.scene.on('postrender:layer', function (cam, layer, transparent) {
            if (!primeOn || transparent) return;
            if (!primeLayer || layer !== primeLayer) return;
            runPrime();
        });

        app.on('postrender', drawDebug);



        /// ---- world-space depth reconstruction ----
        const CLOUD_STEP = 2;                     // sample every Nth texel
        let cloudEntity = null;
        let cloudMesh = null;
        let cloudPos = null;
        let cloudCol = null;
        let cloudCount = 0;
        let cloudOn = false;

        function ensureCloud() {
            if (cloudEntity) return cloudEntity;

            const gw = Math.floor(DEPTH_W / CLOUD_STEP);
            const gh = Math.floor(DEPTH_H / CLOUD_STEP);
            cloudCount = gw * gh;
            cloudPos = new Float32Array(cloudCount * 3);
            cloudCol = new Float32Array(cloudCount * 4);

            const mat = new pc.ShaderMaterial({
                uniqueName: 'depthCloud',
                attributes: {
                    aPosition: pc.SEMANTIC_POSITION,
                    aColor: pc.SEMANTIC_COLOR
                },
                vertexGLSL: [
                    'attribute vec3 aPosition;',
                    'attribute vec4 aColor;',
                    'uniform mat4 matrix_model;',
                    'uniform mat4 matrix_viewProjection;',
                    'uniform float uPointSize;',
                    'varying vec4 vColor;',
                    'void main(void) {',
                    '    vColor = aColor;',
                    '    gl_Position = matrix_viewProjection * matrix_model * vec4(aPosition, 1.0);',
                    '    gl_PointSize = uPointSize;',
                    '}'
                ].join('\n'),
                fragmentGLSL: [
                    'varying vec4 vColor;',
                    'void main(void) {',
                    '    gl_FragColor = vColor;',
                    '}'
                ].join('\n')
            });
            mat.setParameter('uPointSize', 14.0);
            mat.blendType = pc.BLEND_NORMAL;
            mat.depthWrite = true;
            mat.depthTest = true;
            mat.setParameter('uVisible', 0.0);
            mat.update();

            cloudMesh = new pc.Mesh(app.graphicsDevice);
            cloudMesh.clear(true, false);
            cloudMesh.setPositions(cloudPos);
            cloudMesh.setColors(cloudCol, 4);
            cloudMesh.update(pc.PRIMITIVE_POINTS);

            const node = new pc.GraphNode();
            const mi = new pc.MeshInstance(cloudMesh, mat, node);
            mi.cull = false;

            cloudEntity = new pc.Entity('depth-cloud');
            cloudEntity.addComponent('render', { meshInstances: [mi] });
            app.root.addChild(cloudEntity);
            console.log('[pcvr] depth cloud created, points=' + cloudCount);
            return cloudEntity;
        }

        /// unproject the depth buffer through the eye that captured it
        function updateCloud(view, src) {
            ensureCloud();
            const pm = view.projMat.data;
            /// 2.21 exposes only the private _viewInvMat; the public getter does
            /// not exist, and calling it silently killed the whole update
            const inv = view._viewInvMat || view.viewInvMat;
            if (!inv) { console.log('[pcvr] no view inverse matrix'); return; }
            const sx = pm[0], sy = pm[5], kx = pm[8], ky = pm[9];

            const gw = Math.floor(DEPTH_W / CLOUD_STEP);
            const gh = Math.floor(DEPTH_H / CLOUD_STEP);
            const rowBytes = DEPTH_W * 4;
            const tmp = new pc.Vec3();
            let n = 0;

            for (let gy = 0; gy < gh; gy++) {
                const ty = gy * CLOUD_STEP;
                const s0 = (DEPTH_H - 1 - ty) * rowBytes;
                for (let gx = 0; gx < gw; gx++) {
                    const tx = gx * CLOUD_STEP;
                    const si = s0 + tx * 4;
                    const q = src[si] * 256 + src[si + 1];
                    const i3 = n * 3;
                    const i4 = n * 4;
                    n++;

                    if (q === 0) {
                        cloudCol[i4 + 3] = 0;
                        continue;
                    }

                    const d = rawToMetres(q);
                    /// ndc -> view space using this eye's frustum
                    const ndcX = (tx / (DEPTH_W - 1)) * 2 - 1;
                    const ndcY = (ty / (DEPTH_H - 1)) * 2 - 1;
                    tmp.x = d * (ndcX - kx) / sx;
                    tmp.y = d * (ndcY - ky) / sy;
                    tmp.z = -d;
                    inv.transformPoint(tmp, tmp);

                    cloudPos[i3] = tmp.x;
                    cloudPos[i3 + 1] = tmp.y;
                    cloudPos[i3 + 2] = tmp.z;

                    const t = Math.min(d / 4, 1);
                    cloudCol[i4] = 1 - t;
                    cloudCol[i4 + 1] = t * 0.7;
                    cloudCol[i4 + 2] = t;
                    cloudCol[i4 + 3] = 1;
                }
            }

            cloudMesh.setPositions(cloudPos);
            cloudMesh.setColors(cloudCol, 4);
            cloudMesh.update(pc.PRIMITIVE_POINTS);
        }

        /// colour writes off, depth writes on: an invisible occluder
        function setCloudDepthOnly(depthOnly) {
            if (!cloudEntity) return;
            const m = cloudEntity.render.meshInstances[0].material;
            /// transparent fragments still write depth - an invisible occluder
            m.setParameter('uVisible', depthOnly ? 0.0 : 1.0);
            m.depthWrite = true;
            m.depthTest = true;
            m.update();
        }

        /// ---- real-world occlusion -------------------------------------
        /// Prime the depth buffer from the sensor before PlayCanvas draws the
        /// scene. Its geometry then depth-tests against the real room, so a hand
        /// in front of a virtual object actually hides it.
        ///
        /// The sensor gives projective depth with its own near/far; the frame
        /// buffer wants NDC depth for the CURRENT camera projection, so convert:
        ///     z_ndc = -p[10] + p[14] / d      (d = metres, right-handed, -Z fwd)
        ///     gl_FragDepth = (z_ndc + 1) * 0.5
        let occProg = null;
        let occOn = false;
        let occBias = 0.02;          // metres, pushes real geometry slightly back

        function initOccProg() {
            const gl = app.graphicsDevice.gl;
            if (occProg) return occProg;

            const vs = compileShader(gl, gl.VERTEX_SHADER,
                '#version 300 es\n' +
                'out vec2 vUv;\n' +
                'void main() {\n' +
                '    vec2 q = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);\n' +
                '    vUv = q;\n' +
                '    gl_Position = vec4(q * 2.0 - 1.0, 0.0, 1.0);\n' +
                '}\n');
            const fs = compileShader(gl, gl.FRAGMENT_SHADER,
                '#version 300 es\n' +
                'precision highp float;\n' +
                'precision highp sampler2DArray;\n' +
                'uniform sampler2DArray uDepth;\n' +
                'uniform float uLayer;\n' +
                'uniform float uNear;\n' +
                'uniform float uFar;\n' +
                'uniform float uP10;\n' +
                'uniform float uP14;\n' +
                'uniform float uBias;\n' +
                'in vec2 vUv;\n' +
                'out vec4 fragColor;\n' +
                'void main() {\n' +
                '    float raw = texture(uDepth, vec3(vUv, uLayer)).r;\n' +
                /// no reading here -> infinitely far, occlude nothing
                '    if (raw <= 0.0) { gl_FragDepth = 1.0; fragColor = vec4(0.0); return; }\n' +
                '    float invd = (1.0 / uNear) - raw * ((1.0 / uNear) - (1.0 / uFar));\n' +
                '    float dm = 1.0 / max(invd, 0.0001) + uBias;\n' +
                '    float zndc = -uP10 + uP14 / max(dm, 0.01);\n' +
                '    gl_FragDepth = clamp((zndc + 1.0) * 0.5, 0.0, 1.0);\n' +
                '    fragColor = vec4(0.0);\n' +
                '}\n');
            if (!vs || !fs) return null;

            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                console.log('[pcvr] occlusion program link failed: ' + gl.getProgramInfoLog(prog));
                return null;
            }
            occProg = {
                prog: prog,
                uDepth: gl.getUniformLocation(prog, 'uDepth'),
                uLayer: gl.getUniformLocation(prog, 'uLayer'),
                uNear: gl.getUniformLocation(prog, 'uNear'),
                uFar: gl.getUniformLocation(prog, 'uFar'),
                uP10: gl.getUniformLocation(prog, 'uP10'),
                uP14: gl.getUniformLocation(prog, 'uP14'),
                uBias: gl.getUniformLocation(prog, 'uBias')
            };
            console.log('[pcvr] occlusion depth-prime program ready');
            return occProg;
        }

        /// runs before the scene draw, into whatever target PlayCanvas has bound
        function primeDepth() {
            if (!occOn || !app.xr.active || !lastDi || !lastDi.texture) return;
            const gl = app.graphicsDevice.gl;
            const g = initOccProg();
            if (!g) return;
            const views = app.xr.views.list;
            if (!views.length) return;

            const prevProg = gl.getParameter(gl.CURRENT_PROGRAM);
            const prevVao = gl.getParameter(gl.VERTEX_ARRAY_BINDING);
            const prevVp = gl.getParameter(gl.VIEWPORT);
            const prevActive = gl.getParameter(gl.ACTIVE_TEXTURE);
            const prevDepth = gl.isEnabled(gl.DEPTH_TEST);
            const prevScissor = gl.isEnabled(gl.SCISSOR_TEST);

            gl.bindVertexArray(null);
            gl.useProgram(g.prog);
            gl.enable(gl.DEPTH_TEST);
            gl.depthFunc(gl.ALWAYS);
            gl.depthMask(true);
            gl.disable(gl.SCISSOR_TEST);
            /// depth only - leave the colour buffer alone
            gl.colorMask(false, false, false, false);

            const UNIT = 13;
            gl.activeTexture(gl.TEXTURE0 + UNIT);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.bindTexture(gl.TEXTURE_2D_ARRAY, lastDi.texture);
            gl.uniform1i(g.uDepth, UNIT);
            gl.uniform1f(g.uNear, depthNear);
            gl.uniform1f(g.uFar, depthFar);
            gl.uniform1f(g.uBias, occBias);

            for (let i = 0; i < views.length; i++) {
                const vp = views[i].viewport;
                const pm = views[i].projMat.data;
                gl.viewport(vp.x, vp.y, vp.z, vp.w);
                gl.uniform1f(g.uLayer, i);
                gl.uniform1f(g.uP10, pm[10]);
                gl.uniform1f(g.uP14, pm[14]);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }

            gl.colorMask(true, true, true, true);
            gl.depthFunc(gl.LESS);
            gl.useProgram(prevProg);
            gl.bindVertexArray(prevVao);
            gl.viewport(prevVp[0], prevVp[1], prevVp[2], prevVp[3]);
            gl.activeTexture(prevActive);
            if (!prevDepth) gl.disable(gl.DEPTH_TEST);
            if (prevScissor) gl.enable(gl.SCISSOR_TEST);
        }

        app.scene.on('prerender', primeDepth);

        /// a few probes at arm's-length depths to test the occlusion against
        let probes = null;
        function ensureProbes() {
            if (probes) return probes;
            probes = [];
            const spec = [
                { p: [-0.28, 0.0, -0.55], c: [1.0, 0.35, 0.25] },
                { p: [0.00, 0.10, -0.85], c: [0.35, 1.0, 0.55] },
                { p: [0.30, -0.05, -1.20], c: [0.40, 0.60, 1.0] },
                { p: [-0.10, -0.20, -1.60], c: [1.0, 0.85, 0.30] }
            ];
            for (let i = 0; i < spec.length; i++) {
                const e = new pc.Entity('probe' + i);
                e.addComponent('render', {
                    type: 'sphere',
                    material: material(spec[i].c[0], spec[i].c[1], spec[i].c[2], true)
                });
                /// place once, in WORLD space, relative to where the viewer is
                /// standing now - camera-parented content just rides your head
                const wp = camera.getPosition().clone();
                const fwd = camera.forward.clone();
                const right = camera.right.clone();
                const up = camera.up.clone();
                wp.add(right.mulScalar(spec[i].p[0]));
                wp.add(up.mulScalar(spec[i].p[1]));
                wp.add(fwd.mulScalar(-spec[i].p[2]));
                e.setLocalScale(0.16, 0.16, 0.16);
                app.root.addChild(e);
                e.setPosition(wp);
                probes.push(e);
            }
            return probes;
        }

        /// ---- gaussian splat, for testing occlusion against real geometry ----
        let splatEntity = null;
        let splatAsset = null;
        let splatLoading = false;

        function loadSplat(cb) {
            if (splatEntity) { if (cb) cb(null, splatEntity); return; }
            if (splatLoading) return;
            splatLoading = true;

            const asset = new pc.Asset('biker', 'gsplat', { url: 'biker.ply' });
            asset.on('load', function () {
                splatAsset = asset;
                splatEntity = new pc.Entity('splat');
                splatEntity.addComponent('gsplat', { asset: asset });
                /// most captures come in Y-down relative to PlayCanvas
                splatEntity.setLocalScale(0.6, 0.6, 0.6);
                app.root.addChild(splatEntity);
                /// drop it in the room 1.4m ahead of where you are standing
                const wp = camera.getPosition().clone();
                const f = camera.forward.clone().mulScalar(1.4);
                wp.add(f);
                wp.y -= 0.2;
                splatEntity.setPosition(wp);
                splatEntity.setEulerAngles(180, 0, 0);
                splatLoading = false;
                console.log('[pcvr] splat loaded');
                if (cb) cb(null, splatEntity);
            });
            asset.on('error', function (err) {
                splatLoading = false;
                console.log('[pcvr] splat load failed: ' + err);
                if (cb) cb(err);
            });
            app.assets.add(asset);
            app.assets.load(asset);
        }

        /// Live tuning surface. Everything below is driven over the DevTools
        /// connection, so geometry can be adjusted on the running session instead
        /// of going round the deploy/cache/relaunch loop for every value.
        function applyOverlayTransform() {
            if (!depthPreview) return 'no overlay yet';
            if (depthOverlay) {
                const fovRad = (camera.camera.fov || 60) * Math.PI / 180;
                const h = 2 * depthDist * Math.tan(fovRad / 2) * depthSize;
                const w = h * 1.6;
                depthPreview.setLocalPosition(0, 0, -depthDist);
                depthPreview.setLocalScale(w, 1, h);
                const m = depthPreview.render.material;
                m.opacity = depthOpacity;
                m.update();
            }
            return { dist: depthDist, size: depthSize, opacity: depthOpacity };
        }

        window.pcvr = {
            /// geometry
            place: function (d, sz) {
                if (isFinite(d)) depthDist = d;
                if (isFinite(sz)) depthSize = sz;
                return applyOverlayTransform();
            },
            opacity: function (o) {
                if (isFinite(o)) depthOpacity = o;
                return applyOverlayTransform();
            },
            nudge: function (dx, dy) {
                if (!depthPreview) return 'no overlay yet';
                const p = depthPreview.getLocalPosition();
                depthPreview.setLocalPosition(p.x + (dx || 0), p.y + (dy || 0), p.z);
                return { x: p.x + (dx || 0), y: p.y + (dy || 0), z: p.z };
            },
            /// image orientation
            flip: function (v) { depthFlip = !!v; return { flip: depthFlip }; },
            mirror: function (v) { depthMirror = !!v; return { mirror: depthMirror }; },
            /// depth units
            scale: function (v) { if (isFinite(v)) depthScale = v; return { scale: depthScale }; },
            /// visibility
            show: function (v) {
                if (depthPreview) depthPreview.enabled = !!v;
                return { visible: !!v };
            },
            panel: function (v) {
                panel.enabled = !!v;
                return { panel: !!v };
            },
            cubes: function (v) {
                for (let i = 0; i < cubes.length; i++) cubes[i].entity.enabled = !!v;
                return { cubes: !!v };
            },
            /// world-space reconstruction - correct in BOTH eyes
            cloud: function (v, step) {
                cloudOn = !!v;
                if (cloudOn) ensureCloud();
                if (cloudEntity) cloudEntity.enabled = cloudOn;
                if (depthPreview && cloudOn) depthPreview.enabled = false;
                return { cloud: cloudOn, points: cloudCount };
            },
            splat: function (v) {
                if (!v) {
                    if (splatEntity) splatEntity.enabled = false;
                    return { splat: false };
                }
                loadSplat();
                if (splatEntity) splatEntity.enabled = true;
                return { splat: true, loaded: !!splatEntity, loading: splatLoading };
            },
            splatPlace: function (x, y, z, scale) {
                if (!splatEntity) return 'not loaded';
                if (isFinite(x) && isFinite(y) && isFinite(z)) splatEntity.setLocalPosition(x, y, z);
                if (isFinite(scale)) splatEntity.setLocalScale(scale, scale, scale);
                const p2 = splatEntity.getLocalPosition();
                const sc = splatEntity.getLocalScale();
                return { pos: [p2.x, p2.y, p2.z], scale: sc.x };
            },
            splatRotate: function (rx, ry, rz) {
                if (!splatEntity) return 'not loaded';
                splatEntity.setLocalEulerAngles(rx || 0, ry || 0, rz || 0);
                return { euler: [rx || 0, ry || 0, rz || 0] };
            },
            /// the real thing: sensor depth straight into the depth buffer,
            /// before any geometry draws. Meshes and splats both just depth-test.
            prime: function (v) {
                primeOn = v === undefined ? true : !!v;
                if (primeOn) {
                    ensurePrimeLayer();
                    /// the screen-space punch would double up on this
                    dbgOn = false;
                    occOn = false;
                    eyeOn = false;
                    camera.camera.clearDepthBuffer = true;
                    requestSceneDepth(false);
                    ensureProbes();
                }
                return { prime: primeOn, bias: primeBias, layer: !!primeLayer };
            },
            primeBias: function (m) {
                if (isFinite(m)) primeBias = m;
                return { bias: primeBias };
            },
            smooth: function (n) {
                if (isFinite(n)) primeSmooth = n;
                return {
                    smooth: primeSmooth,
                    meaning: ['nearest (blocky)', 'bilinear (smooth, has a skirt)',
                              'bilinear + 3x3 tent', 'edge-snap (FXAA-flavoured)',
                              'FXAA (edge search + resample + feather)', '?',
                              'MLAA strict + gauss-harden'][primeSmooth] || '?',
                    sigma: primeSigma, hardK: primeHardK,
                    soften: primeSoften,
                    edgeThreshold: primeEdge,
                    subpix: primeSubpix
                };
            },
            subpix: function (v) {
                if (isFinite(v)) primeSubpix = v;
                return { subpix: primeSubpix };
            },
            soften: function (r) {
                if (isFinite(r)) primeSoften = r;
                return { soften: primeSoften, note: '0 = crisp FXAA, texels of the depth map' };
            },
            gauss: function (sigma, k) {
                if (isFinite(sigma)) primeSigma = sigma;
                if (isFinite(k)) primeHardK = k;
                return { sigma: primeSigma, hardK: primeHardK };
            },
            smoothEdge: function (t) {
                if (isFinite(t)) primeEdge = t;
                return { edgeThreshold: primeEdge };
            },
            primeStat: function () {
                const ls = app.scene.layers;
                return {
                    on: primeOn,
                    draws: primeDraws,
                    err: primeErr,
                    progReady: !!primeProg,
                    order: ls.layerList.map(function (l, i) {
                        return l.name + (ls.subLayerList[i] ? ':T' : ':O');
                    }),
                    camLayers: camera.camera.layers.slice(),
                    clearDepth: camera.camera.clearDepthBuffer
                };
            },
            debug: function (v) {
                dbgOn = v === undefined ? true : !!v;
                if (dbgOn) {
                    occOn = false;
                    eyeOn = false;
                    camera.camera.clearDepthBuffer = true;
                    if (cloudEntity) cloudEntity.enabled = false;
                    ensureProbes();
                }
                return { debug: dbgOn, mode: dbgMode, metric: dbgMetric ? 'api-d2m' : 'projective' };
            },
            dbgMode: function (m) {
                if (isFinite(m)) dbgMode = m;
                const names = ['sensor ramp', 'sensor ramp + probe test', 'probe test only',
                               'scene depth ramp', 'occlusion verdict (red = real world wins)',
                               'occlusion APPLIED'];
                /// modes 3+ compare against PlayCanvas' depth buffer
                requestSceneDepth(dbgMode > 2.5);
                sceneDepthWarned = false;
                return { mode: dbgMode, meaning: names[dbgMode] || '?' };
            },
            /// shorthand: show me the verdict, then apply it
            verdict: function () { return window.pcvr.dbgMode(4); },
            apply: function () { return window.pcvr.dbgMode(5); },
            sceneDepth: function () {
                const sgl = sceneDepthGl();
                return {
                    requested: sceneDepthRequested,
                    haveTexture: !!sgl,
                    size: lastSceneTex ? [lastSceneTex.width, lastSceneTex.height] : null,
                    format: lastSceneTex ? lastSceneTex.format : null
                };
            },
            dbgRange: function (lo, hi) {
                if (isFinite(lo)) dbgLo = lo;
                if (isFinite(hi)) dbgHi = hi;
                return { lo: dbgLo, hi: dbgHi };
            },
            dbgAlpha: function (a) {
                if (isFinite(a)) dbgAlpha = a;
                return { alpha: dbgAlpha };
            },
            dbgMetric: function (v) {
                if (v !== undefined) dbgMetric = v ? 1 : 0;
                return { metric: dbgMetric ? 'api depthValueToMeters (linear)' : 'projective near/far' };
            },
            dbgUv: function (v) {
                if (v !== undefined) dbgUseUv = v ? 1 : 0;
                return { useDepthUvMatrix: !!dbgUseUv };
            },
            dbgPerView: function (v) {
                if (v !== undefined) dbgPerView = v ? 1 : 0;
                return { perView: !!dbgPerView };
            },
            /// everything the API actually says, rather than what we assumed
            dbg: function () {
                const out = { build: BUILD, active: app.xr.active, probes: probes ? probes.length : 0 };
                const views = app.xr.views.list;
                out.views = views.map(function (v, i) {
                    const di = lastDiViews[i];
                    const uv = v.depthUvMatrix && v.depthUvMatrix.data;
                    return {
                        eye: v.eye,
                        haveDi: !!(di && di.texture),
                        imageIndex: di ? di.imageIndex : null,
                        rawValueToMeters: di ? di.rawValueToMeters : null,
                        depthValueToMeters: v.depthValueToMeters,
                        depthW: di ? di.width : null,
                        depthH: di ? di.height : null,
                        uvMat: uv ? [uv[0], uv[1], uv[4], uv[5], uv[12], uv[13]] : null,
                        proj: v.projMat ? Array.from(v.projMat.data).map(function (n) { return +n.toFixed(4); }) : null,
                        viewport: v.viewport ? [v.viewport.x, v.viewport.y, v.viewport.z, v.viewport.w] : null
                    };
                });
                out.depth = {
                    availableDepth: app.xr.views.availableDepth,
                    refreshes: depthRefreshCount,
                    gateErr: depthGateErr,
                    eyeOn: eyeOn, occOn: occOn, dbgOn: dbgOn,
                    loopAlive: depthLoopSession === app.xr.session,
                    haveTex0: !!(lastDiViews[0] && lastDiViews[0].texture),
                    haveTex1: !!(lastDiViews[1] && lastDiViews[1].texture)
                };
                if (views.length) {
                    const v0 = views[0];
                    const n = fillProbes(v0);
                    out.probeN = n;
                    out.probeInputs = {
                        hasProj: !!(v0.projMat && v0.projMat.data),
                        hasView: !!(v0._viewMat && v0._viewMat.data),
                        probesLen: probes ? probes.length : null
                    };
                    out.probeScreen = Array.from(probeBuf).map(function (n2) { return +n2.toFixed(4); });
                }
                out.scene = window.pcvr.sceneDepth();
                out.settings = {
                    mode: dbgMode, lo: dbgLo, hi: dbgHi, alpha: dbgAlpha,
                    metric: dbgMetric ? 'api-d2m' : 'projective',
                    near: depthNear, far: depthFar,
                    useUv: !!dbgUseUv, perView: !!dbgPerView
                };
                return out;
            },
            occlude: function (v) {
                occOn = !!v;
                /// Depth clearing stays ON. primeDepth runs at scene 'prerender',
                /// which is after the clear and before the draws, so the sensor
                /// depth survives without the eyes fighting over a shared buffer.
                camera.camera.clearDepthBuffer = true;
                /// no CPU path needed at all
                cloudOn = false;
                if (cloudEntity) cloudEntity.enabled = false;
                return { occlude: occOn, mode: 'gpu-zwrite' };
            },
            occluderVisible: function (v) {
                setCloudDepthOnly(!v);
                return { showing: !!v };
            },
            bias: function (m) {
                if (isFinite(m)) occBias = m;
                return { bias: occBias };
            },
            replaceProbes: function () {
                ensureProbes();
                const spec = [[-0.28, 0.0, 0.55], [0.0, 0.10, 0.85],
                              [0.30, -0.05, 1.20], [-0.10, -0.20, 1.60]];
                const wp0 = camera.getPosition();
                const r = camera.right.clone();
                const u = camera.up.clone();
                const f = camera.forward.clone();
                for (let i = 0; i < probes.length; i++) {
                    const wp = wp0.clone();
                    wp.add(r.clone().mulScalar(spec[i][0]));
                    wp.add(u.clone().mulScalar(spec[i][1]));
                    wp.add(f.clone().mulScalar(spec[i][2]));
                    probes[i].enabled = true;
                    probes[i].setPosition(wp);
                }
                return { replaced: probes.length };
            },
            probes: function (v) {
                ensureProbes();
                for (let i = 0; i < probes.length; i++) probes[i].enabled = !!v;
                return { probes: !!v, count: probes.length };
            },
            eyes: function (v) {
                eyeOn = !!v;
                if (eyeOn) {
                    if (depthPreview) depthPreview.enabled = false;
                    if (cloudEntity) cloudEntity.enabled = false;
                    cloudOn = false;
                }
                return { perEye: eyeOn };
            },
            sweepRange: function (lo, hi) {
                if (isFinite(lo)) sweepDistLo = lo;
                if (isFinite(hi)) sweepDistHi = hi;
                buildSweepTable();
                return { metresLo: sweepDistLo, metresHi: sweepDistHi };
            },
            burn: function (frac) {
                if (isFinite(frac)) burnFrac = Math.min(0.95, Math.max(0.05, frac));
                return { burnFrac: burnFrac, fireDist: fireDist };
            },
            focus: function (m, amount, width) {
                if (isFinite(m)) focusDist = m;
                if (isFinite(amount)) dwellAmt = Math.min(0.97, Math.max(0, amount));
                if (isFinite(width)) dwellWidth = width;
                buildSweepTable();
                return { focusDist: focusDist, dwell: dwellAmt, width: dwellWidth };
            },
            detail: function (bands, edge) {
                if (isFinite(bands)) fineBands = bands;
                if (isFinite(edge)) edgeAmt = edge;
                return { fineBands: fineBands, edge: edgeAmt };
            },
            shade: function (k) {
                if (isFinite(k)) shadeAmt = k;
                return { shade: shadeAmt };
            },
            fire: function (m) {
                if (isFinite(m)) fireDist = m;
                return { fireDist: fireDist };
            },
            sweep: function (speed) {
                if (isFinite(speed)) sweepSpeed = speed;
                return { speed: sweepSpeed };
            },
            slice: function (v) {
                if (isFinite(v)) { sweepFixed = v; sweepSpeed = 0; }
                return { slice: sweepFixed, speed: sweepSpeed };
            },
            bands: function (n) {
                if (isFinite(n)) sweepBands = n;
                return { bands: sweepBands };
            },
            sharp: function (v) {
                if (isFinite(v)) sweepSharp = v;
                return { sharp: sweepSharp };
            },
            /// the raw depth map as the sensor actually delivered it
            grab: function () {
                readbackOn = true;
                if (!depthPixels) return { ready: false, note: 'blit has not run yet, call again in ~300ms' };
                const n = DEPTH_W * DEPTH_H;
                const bytes = new Uint8Array(n * 2);
                for (let i = 0; i < n; i++) {
                    /// blitDepth packs the 16-bit value as hi in R, lo in G
                    bytes[i * 2] = depthPixels[i * 4];
                    bytes[i * 2 + 1] = depthPixels[i * 4 + 1];
                }
                let bin = '';
                const CH = 4096;
                for (let i = 0; i < bytes.length; i += CH) {
                    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
                }
                return { ready: true, w: DEPTH_W, h: DEPTH_H, b64: btoa(bin) };
            },
            readback: function (v) {
                readbackOn = !!v;
                return { readback: readbackOn };
            },
            range: function (lo, hi) {
                if (isFinite(lo)) eyeLo = lo;
                if (isFinite(hi)) eyeHi = hi;
                return { lo: eyeLo, hi: eyeHi, observedLo: lastRawLo, observedHi: lastRawHi };
            },
            eyeAlpha: function (a) {
                if (isFinite(a)) eyeAlpha = a;
                return { alpha: eyeAlpha };
            },
            nearFar: function (n, f) {
                if (isFinite(n)) depthNear = n;
                if (isFinite(f)) depthFar = f;
                return { near: depthNear, far: depthFar, projective: depthProjective };
            },
            projective: function (v) {
                depthProjective = !!v;
                return { projective: depthProjective };
            },
            pointSize: function (px) {
                if (!cloudEntity) return 'no cloud';
                cloudEntity.render.meshInstances[0].material.setParameter('uPointSize', px);
                return { pointSize: px };
            },

            /// readings
            stats: function () {
                return {
                    build: BUILD,
                    xr: app.xr.type,
                    raw: lastDepthRaw,
                    rawLo: lastRawLo,
                    rawHi: lastRawHi,
                    metres: rawToMetres(lastDepthRaw),
                    scale: depthScale,
                    dist: depthDist,
                    size: depthSize,
                    opacity: depthOpacity,
                    flip: depthFlip,
                    mirror: depthMirror,
                    fps: Math.round(fps)
                };
            },
            /// depth at an arbitrary point of the map, 0..1 normalised
            at: function (u, v) {
                if (!depthPixels) return null;
                const x = Math.max(0, Math.min(DEPTH_W - 1, Math.round(u * (DEPTH_W - 1))));
                const y = Math.max(0, Math.min(DEPTH_H - 1, Math.round(v * (DEPTH_H - 1))));
                const i = ((DEPTH_H - 1 - y) * DEPTH_W + x) * 4;
                const q = depthPixels[i] * 256 + depthPixels[i + 1];
                return { raw: q, metres: rawToMetres(q) };
            }
        };
        console.log('[pcvr] live control surface ready: window.pcvr');

        app.start();
    })();
    </script>
</body>
</html>
