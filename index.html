<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>PlayCanvas VR Demo</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1a8fe3" />
    <link rel="icon" href="icon-192.png" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05070d; }
        canvas { display: block; width: 100%; height: 100%; }
        #hud {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 24px;
            font: 400 16px/1.5 system-ui, sans-serif; color: #cfd8e6;
            pointer-events: none;
        }
        #hud h1 { margin: 0; font-size: 28px; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
        #enter {
            pointer-events: auto; padding: 18px 40px; font-size: 20px; font-weight: 600;
            color: #05070d; background: #1a8fe3; border: 0; border-radius: 999px; cursor: pointer;
        }
        #enter[disabled] { background: #2b3242; color: #6b7688; cursor: default; }
        #status { font-size: 14px; color: #7d8ba3; max-width: 32ch; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <script src="playcanvas.min.js"></script>
    <div id="hud">
        <h1>PlayCanvas VR Demo</h1>
        <button id="enter">Enter VR</button>
        <div id="status">checking WebXR support&hellip;</div>
    </div>
    <script>
    (function () {
        const canvas = document.createElement('canvas');
        document.body.insertBefore(canvas, document.body.firstChild);

        const app = new pc.Application(canvas, {
            mouse: new pc.Mouse(canvas),
            touch: new pc.TouchDevice(canvas),
            keyboard: new pc.Keyboard(window),
            /// alpha must be true or the framebuffer is opaque and AR passthrough
            /// has nothing to composite through — the scene just renders black.
            graphicsDeviceOptions: { antialias: true, alpha: true }
        });
        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        window.addEventListener('resize', () => app.resizeCanvas());

        /// ?scale=<n> drives the WebXR framebuffer scale factor. 1.0 is the UA
        /// default, which is NOT native resolution — the native factor is only
        /// knowable once a session exists, so the panel reports it and we relaunch
        /// with that number to actually claim it.
        /// Bumped by hand on every deploy — the only reliable way to tell in the
        /// headset whether you are looking at a fresh build or a cached one.
        const BUILD = 18;

        const urlParams = new URLSearchParams(location.search);
        const scaleParam = parseFloat(urlParams.get('scale'));
        const requestedScale = (isFinite(scaleParam) && scaleParam > 0) ? scaleParam : 1.0;

        /// ?mode=ar starts an immersive-ar session with depth sensing. Depth and
        /// anchors are MR features, so they need passthrough (immersive-ar) plus
        /// the USE_SCENE android permission that the packaged APK declares.
        /// VR is the default: a plain launch must always come up. AR/depth is
        /// opt-in via ?mode=ar so an experiment can never break the base demo.
        const arMode = urlParams.get('mode') === 'ar';
        /// PIXELFORMAT_DEPTH (unsigned-short) samples as zero through a normal
        /// sampler2D, so allow the format/usage to be swept from the URL.
        const DFMT = {
            f32: pc.XRDEPTHSENSINGFORMAT_F32,
            la8: pc.XRDEPTHSENSINGFORMAT_L8A8,
            u16: pc.XRDEPTHSENSINGFORMAT_R16U
        };
        const depthFormatPref = DFMT[urlParams.get('dfmt')] || pc.XRDEPTHSENSINGFORMAT_F32;
        /// CPU is the default: getDepth() is disabled under gpu-optimized, and the
        /// GPU texture is unsampleable on Quest Browser anyway.
        const depthUsagePref = urlParams.get('dusage') === 'gpu'
            ? pc.XRDEPTHSENSINGUSAGE_GPU : pc.XRDEPTHSENSINGUSAGE_CPU;
        const dscaleParam = parseFloat(urlParams.get('dscale'));
        const depthScale = isFinite(dscaleParam) ? dscaleParam : 65535.0;
        /// XrManager.start() hard-rejects a type whose async isSessionSupported()
        /// has not resolved yet, so availability must be tracked for the type we
        /// actually intend to start — not just immersive-vr.
        let sessionType = arMode ? pc.XRTYPE_AR : pc.XRTYPE_VR;

        app.scene.ambientLight = new pc.Color(0.12, 0.14, 0.2);

        /// camera lives under a rig so we can move the player without fighting
        /// the headset pose the XR system writes onto the camera itself.
        const rig = new pc.Entity('rig');
        app.root.addChild(rig);

        const camera = new pc.Entity('camera');
        camera.addComponent('camera', {
            clearColor: new pc.Color(0.02, 0.03, 0.05),
            farClip: 200
        });
        camera.setLocalPosition(0, 1.6, 0);
        rig.addChild(camera);

        const light = new pc.Entity('key-light');
        light.addComponent('light', {
            type: 'directional', color: new pc.Color(1, 0.96, 0.9),
            intensity: 1.6, castShadows: true, shadowBias: 0.2,
            normalOffsetBias: 0.05, shadowDistance: 40
        });
        light.setEulerAngles(50, 30, 0);
        app.root.addChild(light);

        const fill = new pc.Entity('fill-light');
        fill.addComponent('light', { type: 'omni', color: new pc.Color(0.3, 0.5, 1), intensity: 2, range: 20 });
        fill.setPosition(0, 3, -4);
        app.root.addChild(fill);

        function material(r, g, b, emissive) {
            const m = new pc.StandardMaterial();
            m.diffuse = new pc.Color(r, g, b);
            m.gloss = 0.7;
            m.metalness = 0.1;
            m.useMetalness = true;
            if (emissive) {
                m.emissive = new pc.Color(r, g, b);
                m.emissiveIntensity = 0.6;
            }
            m.update();
            return m;
        }

        const floor = new pc.Entity('floor');
        floor.addComponent('render', { type: 'plane', material: material(0.09, 0.1, 0.13) });
        floor.setLocalScale(40, 1, 40);
        app.root.addChild(floor);

        /// a ring of cubes at eye height — easy to tell at a glance whether
        /// stereo rendering and head tracking are actually live.
        const cubes = [];
        const COUNT = 12;
        for (let i = 0; i < COUNT; i++) {
            const a = (i / COUNT) * Math.PI * 2;
            const hue = (i / COUNT) * Math.PI * 2;
            const cube = new pc.Entity('cube' + i);
            cube.addComponent('render', {
                type: 'box',
                material: material(
                    0.5 + 0.5 * Math.sin(hue),
                    0.5 + 0.5 * Math.sin(hue + 2.09),
                    0.5 + 0.5 * Math.sin(hue + 4.19),
                    true
                )
            });
            cube.setPosition(Math.sin(a) * 3.5, 1.4, Math.cos(a) * 3.5);
            cube.setLocalScale(0.5, 0.5, 0.5);
            app.root.addChild(cube);
            cubes.push({ entity: cube, phase: a });
        }

        let t = 0;
        app.on('update', function (dt) {
            t += dt;
            for (let i = 0; i < cubes.length; i++) {
                const c = cubes[i];
                c.entity.rotate(20 * dt, 40 * dt, 0);
                const p = c.entity.getPosition();
                c.entity.setPosition(p.x, 1.4 + Math.sin(t * 1.5 + c.phase) * 0.35, p.z);
            }
        });

        /// ---- controller / hand input: draw a ray from each input source ----
        const rays = new Map();
        function addInputSource(inputSource) {
            const e = new pc.Entity('ray');
            e.addComponent('render', { type: 'box', material: material(0.9, 0.9, 1, true) });
            e.setLocalScale(0.012, 0.012, 1.2);
            app.root.addChild(e);
            rays.set(inputSource, e);
        }
        function removeInputSource(inputSource) {
            const e = rays.get(inputSource);
            if (e) { e.destroy(); rays.delete(inputSource); }
        }
        if (app.xr && app.xr.input) {
            app.xr.input.on('add', addInputSource);
            app.xr.input.on('remove', removeInputSource);
        }
        app.on('update', function () {
            rays.forEach(function (e, inputSource) {
                const o = inputSource.getOrigin();
                const d = inputSource.getDirection();
                e.setPosition(o.x + d.x * 0.6, o.y + d.y * 0.6, o.z + d.z * 0.6);
                e.lookAt(o.x + d.x, o.y + d.y, o.z + d.z);
            });
        });

        /// ---- diagnostics panel ----
        /// Quest Browser gives us no devtools socket, so the readout has to live
        /// in the scene itself: a canvas texture on a quad pinned to the camera.
        const PANEL_W = 1024;
        const PANEL_H = 512;
        const panelCanvas = document.createElement('canvas');
        panelCanvas.width = PANEL_W;
        panelCanvas.height = PANEL_H;
        const pctx = panelCanvas.getContext('2d');

        const panelTex = new pc.Texture(app.graphicsDevice, {
            width: PANEL_W,
            height: PANEL_H,
            format: pc.PIXELFORMAT_RGBA8,
            mipmaps: false,
            addressU: pc.ADDRESS_CLAMP_TO_EDGE,
            addressV: pc.ADDRESS_CLAMP_TO_EDGE
        });
        panelTex.setSource(panelCanvas);

        const panelMat = new pc.StandardMaterial();
        panelMat.diffuse = new pc.Color(0, 0, 0);
        panelMat.emissiveMap = panelTex;
        panelMat.emissive = new pc.Color(1, 1, 1);
        panelMat.useLighting = false;
        panelMat.update();

        const panel = new pc.Entity('diagnostics');
        panel.addComponent('render', { type: 'plane', material: panelMat, castShadows: false });
        panel.setLocalEulerAngles(90, 0, 0);
        panel.setLocalPosition(0, -0.28, -1.1);
        panel.setLocalScale(0.72, 1, 0.36);
        camera.addChild(panel);

        function drawPanel(lines) {
            pctx.fillStyle = 'rgba(6, 10, 18, 0.94)';
            pctx.fillRect(0, 0, PANEL_W, PANEL_H);
            pctx.strokeStyle = '#1a8fe3';
            pctx.lineWidth = 6;
            pctx.strokeRect(3, 3, PANEL_W - 6, PANEL_H - 6);
            pctx.textBaseline = 'top';
            for (let i = 0; i < lines.length; i++) {
                /// build stamp gets accent colour so a stale cache is obvious
                if (i === 0) {
                    pctx.fillStyle = '#4cc2ff';
                    pctx.font = '700 44px "Consolas", "Courier New", monospace';
                } else {
                    pctx.fillStyle = '#e8eef8';
                    pctx.font = '600 34px "Consolas", "Courier New", monospace';
                }
                pctx.fillText(lines[i], 34, 24 + i * 44);
            }
            panelTex.upload();
        }

        function num(v, digits) {
            return (typeof v === 'number' && isFinite(v)) ? v.toFixed(digits) : '?';
        }

        function refreshPanel() {
            const lines = [
                'BUILD ' + BUILD + '   mode=' + (sessionType === pc.XRTYPE_AR ? 'ar' : 'vr'),
                '',
                'scale req : ' + num(requestedScale, 3)
            ];
            const s = app.xr.session;

            if (s) {
                let nativeScale = NaN;
                try {
                    nativeScale = window.XRWebGLLayer.getNativeFramebufferScaleFactor(s);
                } catch (e) { /* not exposed on this UA */ }

                const bl = s.renderState && s.renderState.baseLayer;
                let viewCount = '?';
                try { viewCount = app.xr.views.list.length; } catch (e) { /* older api */ }

                lines.push('scale nat : ' + num(nativeScale, 3));
                lines.push('scale pc  : ' + num(app.xr.framebufferScaleFactor, 3));
                lines.push('framebuf  : ' + (bl ? bl.framebufferWidth + ' x ' + bl.framebufferHeight : 'n/a'));
                lines.push('views     : ' + viewCount);
                lines.push('refresh   : ' + (s.frameRate ? num(s.frameRate, 0) + ' Hz' : 'n/a'));
                lines.push('rates     : ' + (s.supportedFrameRates ?
                    Array.from(s.supportedFrameRates).join(' ') : 'n/a'));

                if (arMode) {
                    const v = app.xr.views;
                    lines.push('depth sup : ' + v.supportedDepth + '  avail: ' + v.availableDepth);
                    lines.push('depth fmt : ' + v.depthFormat + ' / ' + v.depthUsage);
                    bindDepthPreview();
                }
            } else {
                lines.push('(no xr session yet)');
            }

            lines.push('fps       : ' + num(fps, 1));
            drawPanel(lines);
        }

        /// CPU depth: view.getDepth(u, v) returns metres directly, but PlayCanvas
        /// disables it under gpu-optimized usage. The GPU path hands back a
        /// PIXELFORMAT_DEPTH texture that samples as exactly zero through a normal
        /// sampler2D, so we take the CPU path and paint the grid ourselves.
        const DEPTH_GRID = 64;
        let depthPreview = null;
        let depthCanvas = null;
        let depthCtx = null;
        let depthImage = null;
        let depthTexture = null;

        function bindDepthPreview() {
            const views = app.xr.views;
            if (!views.availableDepth || !views.list.length) return;
            const view = views.list[0];

            if (!depthPreview) {
                depthCanvas = document.createElement('canvas');
                depthCanvas.width = DEPTH_GRID;
                depthCanvas.height = DEPTH_GRID;
                depthCtx = depthCanvas.getContext('2d');
                depthImage = depthCtx.createImageData(DEPTH_GRID, DEPTH_GRID);

                depthTexture = new pc.Texture(app.graphicsDevice, {
                    width: DEPTH_GRID,
                    height: DEPTH_GRID,
                    format: pc.PIXELFORMAT_RGBA8,
                    mipmaps: false,
                    addressU: pc.ADDRESS_CLAMP_TO_EDGE,
                    addressV: pc.ADDRESS_CLAMP_TO_EDGE
                });
                depthTexture.setSource(depthCanvas);

                const m = new pc.StandardMaterial();
                m.diffuse = new pc.Color(0, 0, 0);
                m.emissive = new pc.Color(1, 1, 1);
                m.emissiveMap = depthTexture;
                m.useLighting = false;
                m.update();

                depthPreview = new pc.Entity('depth-preview');
                depthPreview.addComponent('render', { type: 'plane', material: m, castShadows: false });
                depthPreview.setLocalEulerAngles(90, 0, 0);
                depthPreview.setLocalPosition(0.56, -0.28, -1.1);
                depthPreview.setLocalScale(0.34, 1, 0.34);
                camera.addChild(depthPreview);

                console.log('[pcvr] depth preview created, gpuOptimized=' + views.depthGpuOptimized);
            }

            const data = depthImage.data;
            let got = 0;
            for (let y = 0; y < DEPTH_GRID; y++) {
                for (let x = 0; x < DEPTH_GRID; x++) {
                    const d = view.getDepth(x / (DEPTH_GRID - 1), y / (DEPTH_GRID - 1));
                    const i = (y * DEPTH_GRID + x) * 4;
                    if (d === null || !isFinite(d) || d <= 0) {
                        /// green marks "no sample here", so a dead path is obvious
                        data[i] = 0; data[i + 1] = 180; data[i + 2] = 0;
                    } else {
                        got++;
                        const n = Math.min(d / 4, 1);
                        data[i] = Math.round(255 * (1 - n));
                        data[i + 1] = Math.round(255 * n * 0.7);
                        data[i + 2] = Math.round(255 * n);
                    }
                    data[i + 3] = 255;
                }
            }
            depthCtx.putImageData(depthImage, 0, 0);
            depthTexture.upload();

            if (!depthPreview.__logged) {
                depthPreview.__logged = true;
                console.log('[pcvr] depth samples valid=' + got + '/' + (DEPTH_GRID * DEPTH_GRID) +
                    ' centre=' + view.getDepth(0.5, 0.5));
            }
        }


        let fps = 0;
        let frameCount = 0;
        let frameAccum = 0;
        app.on('update', function (dt) {
            frameCount++;
            frameAccum += dt;
            if (frameAccum >= 0.5) {
                fps = frameCount / frameAccum;
                frameCount = 0;
                frameAccum = 0;
                refreshPanel();
            }
        });

        /// ---- session plumbing ----
        const hud = document.getElementById('hud');
        const btn = document.getElementById('enter');
        const status = document.getElementById('status');

        function setStatus(msg) { status.textContent = msg; }

        let sessionRequested = false;

        function startXR(reason) {
            if (sessionRequested || app.xr.active) return;
            sessionRequested = true;
            console.log('[pcvr] requesting session (' + reason + ') scale=' + requestedScale +
                ' mode=' + (arMode ? 'ar' : 'vr'));

            const opts = {
                framebufferScaleFactor: requestedScale,
                callback: function (err) {
                    if (err) {
                        /// let a later trigger (the button, or availability
                        /// arriving late) try again rather than latching off.
                        sessionRequested = false;
                        console.log('[pcvr] session failed: ' + err.message);
                        setStatus('could not start session: ' + err.message);
                    } else {
                        console.log('[pcvr] session started');
                    }
                }
            };

            if (sessionType === pc.XRTYPE_AR) {
                /// the floor is passthrough now, so drop our own ground plane
                floor.enabled = false;
                opts.depthSensing = {
                    usagePreference: depthUsagePref,
                    dataFormatPreference: depthFormatPref
                };
            }

            app.xr.start(camera.camera, sessionType, pc.XRSPACE_LOCALFLOOR, opts);
        }

        app.xr.on('start', function () {
            hud.classList.add('hidden');
            /// transparent clear in AR so the real room shows behind the scene
            if (app.xr.type === pc.XRTYPE_AR) {
                camera.camera.clearColor = new pc.Color(0, 0, 0, 0);
                console.log('[pcvr] ar clear colour set transparent');
            }
        });
        app.xr.on('end', function () {
            hud.classList.remove('hidden');
            setStatus('session ended — tap to re-enter');
        });

        btn.addEventListener('click', function () { startXR('button'); });

        console.log('[pcvr] boot | build=' + BUILD + ' | xr.supported=' + app.xr.supported +
            ' | available=' + app.xr.isAvailable(sessionType));
        document.querySelector('#hud h1').textContent = 'PlayCanvas VR Demo — build ' + BUILD;

        if (!app.xr.supported) {
            btn.disabled = true;
            setStatus('this browser has no WebXR — the demo still runs flat');
        } else {
            /// Availability resolves asynchronously (navigator.xr.isSessionSupported),
            /// so on a headset it is still false at load time. Auto-start has to hang
            /// off this event as well, not just the synchronous read below.
            /// Availability for each session type resolves independently and can
            /// arrive in any order, so re-evaluate the choice on every event
            /// instead of committing to one type up front. AR preferred, VR is
            /// the floor, and a timeout guarantees we never sit in the OS splash.
            let arResolved = false;
            const startedAt = Date.now();

            const tryStart = function (reason) {
                if (sessionRequested || app.xr.active) return;

                if (arMode && app.xr.isAvailable(pc.XRTYPE_AR)) {
                    sessionType = pc.XRTYPE_AR;
                    startXR(reason + ':ar');
                    return;
                }

                /// immersive-vr availability lands a beat before immersive-ar, so
                /// don't settle for VR until AR has actually reported in — otherwise
                /// we always lose the race and never get passthrough.
                if (arMode && !arResolved && Date.now() - startedAt < 1500) return;

                if (app.xr.isAvailable(pc.XRTYPE_VR)) {
                    sessionType = pc.XRTYPE_VR;
                    floor.enabled = true;
                    startXR(reason + ':vr');
                }
            };

            [pc.XRTYPE_AR, pc.XRTYPE_VR].forEach(function (t) {
                app.xr.on('available:' + t, function (available) {
                    console.log('[pcvr] available:' + t + ' -> ' + available);
                    if (t === pc.XRTYPE_AR) arResolved = true;
                    btn.disabled = !(app.xr.isAvailable(pc.XRTYPE_VR) ||
                        app.xr.isAvailable(pc.XRTYPE_AR));
                    tryStart('event');
                });
            });

            setStatus('checking for a headset…');

            /// Meta grants the activation to an immersive-mode PWA: "clicking the PWA
            /// app icon is considered user action to create a WebXR session". So the
            /// launch itself is the gesture — request as soon as a device is known.
            tryStart('load');

            /// An immersive-ar request can sit pending forever (permission prompt,
            /// or activation the UA won't honour) — and because sessionRequested is
            /// already true, nothing would ever retry. If no session is actually
            /// live by now, drop the pending request and take VR instead.
            setTimeout(function () {
                if (app.xr.active) return;
                console.log('[pcvr] no session after 4s, forcing vr (was ' + sessionType + ')');
                sessionRequested = false;
                sessionType = pc.XRTYPE_VR;
                floor.enabled = true;
                startXR('timeout');
            }, 10000);
        }

        /// flat fallback: slow orbit so a desktop / 2D launch is not a dead screen
        app.on('update', function (dt) {
            if (app.xr.active) return;
            rig.rotate(0, 4 * dt, 0);
        });

        app.start();
    })();
    </script>
</body>
</html>
